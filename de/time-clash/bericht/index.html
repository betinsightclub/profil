<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#031720">
<title>TIME CLASH Bericht – BetInsight</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#020d14;--panel:#061b28;--line:#24516b;--gold:#f7c64e;--cyan:#74d9ff;--text:#f5fbff;--muted:#9eb5c3;--green:#3ce5a5;--red:#ff6b78}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#123b56,#020d14 65%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto}
header{border-bottom:1px solid #18425a;background:#03131e;position:sticky;top:0;z-index:20}
.nav{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:8px 0}
.brand img{display:block;width:300px;height:64px;max-width:300px;object-fit:contain;object-position:left center}
.nav nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:flex-end}
.nav a{color:#cfe5f1;text-decoration:none;font-size:14px;font-weight:800;white-space:nowrap}
.nav a.active{color:var(--gold)}
.reportLanguage{display:inline-flex;align-items:center;border:1px solid #315f78;border-radius:999px;padding:2px;background:#061b28}
.reportLanguage select{border:0;border-radius:999px;background:#0a5278;color:#fff;font-weight:900;font-size:12px;padding:7px 26px 7px 9px;cursor:pointer;outline:none}
.reportLanguage select option{color:#061b28;background:#fff}
.hero{text-align:center;padding:42px 0 24px}
.hero .eyebrow{color:var(--gold);font-weight:900;letter-spacing:.16em;font-size:12px}
.hero h1{font-size:clamp(40px,7vw,68px);margin:6px 0}
.hero p{color:var(--muted);margin:0}
.back{margin-top:18px}
.back a{color:var(--cyan);text-decoration:none;font-weight:900}
.card{border:1px solid var(--line);background:#061b28;border-radius:20px;padding:20px;margin:16px 0}
.summary{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;text-align:center}
.team h2{margin:4px 0;font-size:clamp(22px,4vw,34px)}
.team small{color:var(--muted)}
.series strong{display:block;font-size:42px;color:var(--gold)}
.series span{color:var(--muted);font-size:12px}
.meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.pill{border:1px solid #315f78;border-radius:999px;padding:7px 11px;color:#cfe5f1;font-size:12px}
.context{display:grid;gap:10px}
.context p{margin:0;color:#c7dce7;line-height:1.55}
.games{display:grid;gap:14px}
.game{border:1px solid #1d4f69;border-radius:16px;background:#04131d;padding:16px}
.gameHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.gameHead h3{margin:0}
.score{font-size:24px;font-weight:1000;color:var(--gold)}
.gameMeta{color:var(--muted);font-size:12px;margin-top:5px}
.lines{margin:12px 0 0;padding-left:20px;color:#c8dce6}
.lines li{margin:8px 0;line-height:1.45}
.events{margin-top:14px;border-top:1px solid #16394d;padding-top:10px}
.gameComments{margin-top:16px;border-top:1px solid #1a455c;padding-top:14px}.gameCommentsHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.gameCommentsHead h4{margin:0;font-size:15px}.commentList{display:grid;gap:8px;margin-top:10px}.commentItem{background:#082131;border:1px solid #173f55;border-radius:10px;padding:9px 11px}.commentItem b{color:var(--cyan);font-size:12px}.commentItem small{color:#6f93a6;margin-left:8px}.commentItem p{margin:5px 0 0;line-height:1.4;color:#d8e8f0}.commentForm{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.commentForm textarea{resize:vertical;min-height:42px;max-height:120px;border:1px solid #2a607c;border-radius:10px;background:#03131e;color:#fff;padding:10px;font:inherit}.commentForm button{border:0;border-radius:10px;background:#0b79ad;color:#fff;font-weight:900;padding:0 14px;cursor:pointer}.commentHint{margin-top:7px;color:#7899aa;font-size:11px}.commentError{color:#ff8490;font-size:11px;margin-top:6px}
.event{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #102f40}
.event b{color:var(--gold)}
.status{text-align:center;padding:28px;color:var(--muted)}
.error{color:var(--red)}
.footerActions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 42px}
.btn{display:inline-block;text-decoration:none;border:1px solid #2a6e94;background:#0a5278;color:#fff;border-radius:11px;padding:12px 18px;font-weight:900}
.btn.primary{background:linear-gradient(135deg,#ffd969,#e8a92e);color:#10202a;border-color:var(--gold)}
@media(max-width:760px){
  .nav nav{display:none}
  .brand img{width:230px;height:54px;max-width:230px}
  .summary{grid-template-columns:1fr}
  .series{order:3}
}

/* TIME CLASH compact navigation */
.tcCompactNav{display:flex!important;align-items:center!important;gap:10px!important;flex-wrap:nowrap!important}
.tcNavPill,.tcRealMenu>summary{display:inline-flex;align-items:center;min-height:36px;padding:8px 12px;border:1px solid #24516b;border-radius:999px;background:#061b28;color:#d9eef8!important;text-decoration:none!important;font-size:12px!important;font-weight:900!important;line-height:1;white-space:nowrap;cursor:pointer;list-style:none}
.tcNavPill.active{border-color:#9f7a1d;background:#2a220b;color:#f7c64e!important}
.tcRealMenu{position:relative}
.tcRealMenu>summary::-webkit-details-marker{display:none}
.tcRealMenu[open]>summary{border-color:#3d7898;background:#0a2b3b}
.tcRealDrop{position:absolute;right:0;top:44px;z-index:80;min-width:210px;padding:8px;border:1px solid #24516b;border-radius:14px;background:#03131e;box-shadow:0 18px 50px #0009}
.tcRealDrop a{display:block!important;padding:10px 11px!important;border-radius:9px!important;color:#d9eef8!important;text-decoration:none!important;font-size:12px!important;font-weight:800!important}
.tcRealDrop a:hover{background:#0a2b3b;color:#fff!important}
.tcBrandHome{display:flex;align-items:center;text-decoration:none}
@media(max-width:760px){
  .tcCompactNav{gap:6px!important}
  .tcRealMenu>summary,.tcNavPill{padding:7px 9px!important;font-size:11px!important}
  .tcRealDrop{right:0;min-width:190px}
}
</style>
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand tcBrandHome" id="tcHomeLogo" href="https://betinsight.club/de/"><img src="https://raw.githubusercontent.com/betinsightclub/profil/main/logo_betisight.club.png" alt="BetInsight"></a>
    <nav class="tcCompactNav">
      <a href="/time-clash/" class="tcNavPill active">TIME CLASH</a>
      <details class="tcRealMenu"><summary id="tcRealMenuLabel">ECHTE WELT ▾</summary><div class="tcRealDrop"><a id="tcRealHome" href="https://betinsight.club/de/">Startseite</a><a id="tcRealTips" href="https://betinsight.club/de/tipps/">Tipps &amp; Analysen</a><a id="tcRealStats" href="https://betinsight.club/de/statistik-vorschau/">Echte Statistik</a></div></details>
      <span class="reportLanguage"><select id="reportLanguageSelect" aria-label="Sprache wählen"><option value="de">🇩🇪 DE</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="pt">🇧🇷 PT</option><option value="it">🇮🇹 IT</option><option value="fr">🇫🇷 FR</option></select></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="back"><a href="/time-clash/">← Zurück zu TIME CLASH</a></div>
  <section class="hero">
    <div class="eyebrow">BETINSIGHT MATCH LAB</div>
    <h1>TIME CLASH BERICHT</h1>
    <p>Dein Bericht zur abgeschlossenen Simulation.</p>
  </section>

  <div id="status" class="card status">Bericht wird geladen …</div>

  <section id="report" hidden>
    <div class="card">
      <div class="summary">
        <div class="team"><small>TEAM A</small><h2 id="teamA">–</h2></div>
        <div class="series"><span>SERIE</span><strong id="seriesScore">–</strong><span id="winner">–</span></div>
        <div class="team"><small>TEAM B</small><h2 id="teamB">–</h2></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="card">
      <h2>Einordnung</h2>
      <div class="context" id="context"></div>
    </div>

    <div class="card">
      <h2>Spielberichte</h2>
      <div class="games" id="games"></div>
    </div>

    <div class="footerActions">
      <a class="btn primary" href="/time-clash/">Neuen TIME CLASH starten</a>
      <a class="btn" href="/time-clash/mein-team/">Mein Team</a>
    </div>
  </section>
</main>

<script>
const API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-report";
const COMMENTS_API="https://lszlaglwlixejzytrurg.supabase.co/functions/v1/time-clash-comments";
const reportParams=new URLSearchParams(location.search);
let commentKey=reportParams.get("ck")||sessionStorage.getItem("bi_tc_comment_key")||"";
if(reportParams.get("ck"))try{
  sessionStorage.setItem("bi_tc_comment_key",reportParams.get("ck"));
  const cleanUrl=new URL(location.href);
  cleanUrl.searchParams.delete("ck");
  history.replaceState(null,"",cleanUrl.pathname+cleanUrl.search+cleanUrl.hash);
}catch(e){};
function localMemberCredential(){
  try{return localStorage.getItem("betinsight_dashboard_token")||localStorage.getItem("betinsight_profile_token")||""}catch(e){return""}
}
async function ensureCommentKey(){
  if(commentKey)return true;
  const credential=localMemberCredential();
  if(!credential)return false;
  try{
    const r=await fetch(COMMENTS_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"session",credential})});
    const d=await r.json();
    if(!r.ok||!d.access_key)return false;
    commentKey=d.access_key;
    try{sessionStorage.setItem("bi_tc_comment_key",commentKey)}catch(e){}
    return true;
  }catch(e){return false}
}

function initReportLanguageSwitch(){
  const sel=document.getElementById("reportLanguageSelect");
  if(!sel)return;
  sel.value="de";
  sel.addEventListener("change",async()=>{
    const targetLang=sel.value;
    if(targetLang==="de")return;
    await ensureCommentKey();
    const u=new URL("https://betinsight.club/"+targetLang+"/time-clash/bericht/");
    u.searchParams.set("clash",slug);
    u.searchParams.set("from","app");
    if(commentKey)u.searchParams.set("ck",commentKey);
    location.href=u.toString();
  });
}

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const slug=reportParams.get("clash")||"";
const statusEl=document.getElementById("status");
const reportEl=document.getElementById("report");
initReportLanguageSwitch();

function fallbackLines(r,g,i){
  const ga=Number(g.ga||0),gb=Number(g.gb||0);
  const winner=ga>gb?r.team_a:gb>ga?r.team_b:"Kein Sieger";
  return [
    r.team_a+" und "+r.team_b+" trafen im "+(i+1)+". Spiel der Serie aufeinander.",
    g.venue?"Austragungsort: "+g.venue+(g.weather?" · "+g.weather:"")+".":"Die Partie wurde als TIME-CLASH-Simulation ausgetragen.",
    "Endstand: "+r.team_a+" "+ga+":"+gb+" "+r.team_b+".",
    winner==="Kein Sieger"?"Das Einzelspiel endete unentschieden.":winner+" gewann dieses Einzelspiel."
  ];
}

function render(r){
  document.title=r.team_a+" vs. "+r.team_b+" – TIME CLASH Bericht";
  document.getElementById("teamA").textContent=r.team_a||"–";
  document.getElementById("teamB").textContent=r.team_b||"–";
  document.getElementById("seriesScore").textContent=(r.series_a??0)+" : "+(r.series_b??0);
  document.getElementById("winner").textContent="Seriensieger: "+(r.winner||"–");
  const date=r.created_at?new Date(r.created_at).toLocaleString("de-DE"):"";
  document.getElementById("meta").innerHTML=[
    r.series_length+" Spiele",
    date,
    r.prediction?"Dein Tipp: "+r.prediction:null,
    r.prediction_correct===true?"Tipp richtig":r.prediction_correct===false?"Tipp daneben":null
  ].filter(Boolean).map(x=>'<span class="pill">'+esc(x)+'</span>').join("");

  const ctx=(r.report_summary&&Array.isArray(r.report_summary.context))?r.report_summary.context:[
    "Dieser Bericht basiert ausschließlich auf den gespeicherten Daten der abgeschlossenen TIME-CLASH-Simulation.",
    "TIME CLASH ist eine fiktive Unterhaltungssimulation und keine Wettprognose."
  ];
  document.getElementById("context").innerHTML=ctx.map(x=>"<p>"+esc(x)+"</p>").join("");

  const reportGames=(r.report_summary&&Array.isArray(r.report_summary.games))?r.report_summary.games:[];
  document.getElementById("games").innerHTML=(r.games||[]).map((g,i)=>{
    const stored=reportGames.find(x=>Number(x.game)===i+1);
    const lines=stored&&Array.isArray(stored.lines)?stored.lines:fallbackLines(r,g,i);
    const ev=Array.isArray(g.ev)?g.ev:[];
    const events=ev.length?'<div class="events">'+ev.map(e=>'<div class="event"><b>'+esc((e.m??"–")+"'")+'</b><span>'+esc(e.msg||"Ereignis")+'</span></div>').join("")+'</div>':"";
    return '<article class="game"><div class="gameHead"><div><h3>Spiel '+(i+1)+'</h3><div class="gameMeta">'+esc(g.venue||"TIME CLASH Arena")+(g.weather?" · "+esc(g.weather):"")+'</div></div><div class="score">'+esc(r.team_a)+' '+Number(g.ga||0)+':'+Number(g.gb||0)+' '+esc(r.team_b)+'</div></div><ul class="lines">'+lines.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"+events+
    '<div class="gameComments" data-game="'+(i+1)+'"><div class="gameCommentsHead"><h4>💬 Kommentare zu Spiel '+(i+1)+'</h4><span class="pill commentCount">0</span></div><div class="commentList"><div class="commentHint">Kommentare werden geladen …</div></div>'+
    (commentKey?'<form class="commentForm"><textarea maxlength="500" placeholder="Dein Kommentar zu diesem Spiel …" required></textarea><button type="submit">Senden</button></form><div class="commentHint">Nur registrierte BetInsight-User können schreiben.</div><div class="commentError"></div>':'<div class="commentHint">Lesen ist öffentlich. Zum Schreiben bitte kostenlos registrieren oder als BetInsight-Mitglied anmelden.</div><div class="footerActions" style="justify-content:flex-start;margin:10px 0 0"><a class="btn primary" href="https://betinsight.systeme.io/registrierung?ref=POOL">KOSTENLOS REGISTRIEREN & KOMMENTIEREN</a><a class="btn" href="https://betinsight.systeme.io/school/course/mitglieder/lecture/9870726">BEREITS MITGLIED? ANMELDEN</a></div>')+
    '</div></article>';
  }).join("");

  statusEl.hidden=true;
  reportEl.hidden=false;
  initComments();
}

function commentDate(v){try{return new Date(v).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}catch(e){return""}}
async function loadComments(box){
 const game=Number(box.dataset.game||0),list=box.querySelector(".commentList"),count=box.querySelector(".commentCount");
 try{
  const r=await fetch(COMMENTS_API+"?slug="+encodeURIComponent(slug)+"&game="+game,{cache:"no-store"}),d=await r.json();
  if(!r.ok)throw new Error(d.error||"comments");
  const arr=Array.isArray(d.comments)?d.comments:[];
  count.textContent=String(arr.length);
  list.innerHTML=arr.length?arr.map(x=>'<div class="commentItem"><b>'+esc(x.author||"BetInsight User")+'</b><small>'+esc(commentDate(x.created_at))+'</small><p>'+esc(x.body||"")+'</p></div>').join(""):'<div class="commentHint">Noch kein Kommentar. Du kannst der Erste sein.</div>';
 }catch(e){list.innerHTML='<div class="commentError">Kommentare konnten gerade nicht geladen werden.</div>'}
}
function initComments(){
 document.querySelectorAll(".gameComments").forEach(box=>{
  loadComments(box);
  const form=box.querySelector(".commentForm");if(!form)return;
  form.addEventListener("submit",async ev=>{
   ev.preventDefault();const ta=form.querySelector("textarea"),btn=form.querySelector("button"),err=box.querySelector(".commentError"),body=ta.value.trim();
   if(!body)return;btn.disabled=true;err.textContent="";
   try{
    const r=await fetch(COMMENTS_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"comment",slug,game:Number(box.dataset.game||0),access_key:commentKey,body})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"comment_failed");
    ta.value="";await loadComments(box);
   }catch(e){
    const m=String(e.message||"");err.textContent=m==="rate_limited"?"Bitte warte ein paar Sekunden bis zum nächsten Kommentar.":m==="registered_only"?"Dein Kommentar-Zugang ist abgelaufen. Öffne den Bericht erneut aus TIME CLASH.":"Kommentar konnte nicht gespeichert werden.";
   }finally{btn.disabled=false}
  });
 });
}

if(!slug){
  statusEl.innerHTML='<span class="error">Kein Bericht ausgewählt.</span>';
}else{
  ensureCommentKey()
    .catch(()=>false)
    .then(()=>fetch(API+"?slug="+encodeURIComponent(slug),{cache:"no-store"}))
    .then(async x=>{const d=await x.json();if(!x.ok||!d.report)throw new Error(d.error||"not_found");return d.report})
    .then(render)
    .catch(()=>{statusEl.innerHTML='<span class="error">Der gespeicherte TIME-CLASH-Bericht konnte nicht geladen werden.</span><br><br><a class="btn" href="/time-clash/">Zurück zu TIME CLASH</a>'});
}
</script>
<script>
(function(){
  const supported=["de","en","es","pt","it","fr"];
  function currentLang(){
    let l=(new URLSearchParams(location.search).get("lang")||"").toLowerCase().slice(0,2);
    try{ if(typeof TC_DISPLAY_LANG!=="undefined"&&TC_DISPLAY_LANG) l=String(TC_DISPLAY_LANG).toLowerCase().slice(0,2); }catch(e){}
    if(!supported.includes(l)) l=(document.documentElement.lang||"de").toLowerCase().slice(0,2);
    return supported.includes(l)?l:"de";
  }
  const copy={
    de:{real:"ECHTE WELT ▾",home:"Startseite",tips:"Tipps & Analysen",stats:"Echte Statistik"},
    en:{real:"REAL WORLD ▾",home:"Home",tips:"Tips & Analysis",stats:"Real Statistics"},
    es:{real:"MUNDO REAL ▾",home:"Inicio",tips:"Pronósticos y análisis",stats:"Estadísticas reales"},
    pt:{real:"MUNDO REAL ▾",home:"Início",tips:"Dicas e análises",stats:"Estatísticas reais"},
    it:{real:"MONDO REALE ▾",home:"Home",tips:"Pronostici e analisi",stats:"Statistiche reali"},
    fr:{real:"MONDE RÉEL ▾",home:"Accueil",tips:"Pronostics et analyses",stats:"Statistiques réelles"}
  };
  function sync(){
    const l=currentLang(),t=copy[l]||copy.de;
    const logo=document.getElementById("tcHomeLogo"),home=document.getElementById("tcRealHome"),tips=document.getElementById("tcRealTips"),stats=document.getElementById("tcRealStats"),label=document.getElementById("tcRealMenuLabel");
    if(logo)logo.href="https://betinsight.club/"+l+"/";
    if(home){home.href="https://betinsight.club/"+l+"/";home.textContent=t.home}
    if(tips){tips.href="https://betinsight.club/"+l+"/tipps/";tips.textContent=t.tips}
    if(stats){stats.href="https://betinsight.club/"+l+"/statistik-vorschau/";stats.textContent=t.stats}
    if(label)label.textContent=t.real;
  }
  sync();
  document.addEventListener("click",e=>{
    document.querySelectorAll(".tcRealMenu[open]").forEach(d=>{if(!d.contains(e.target))d.removeAttribute("open")});
  });
  window.addEventListener("pageshow",sync);
})();
</script></body></html>

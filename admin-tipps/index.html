<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d2a"><title>BetInsight – Tippbereich</title><style>body{margin:0;background:#061d2a;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.load{padding:30px;text-align:center}.spin{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#16a8f5;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><strong>BetInsight Tipp-Terminal · Kombi wird geladen …</strong></div><script>(async()=>{try{const files=['livev11.part0','livev11.part1','livev11.part2','livev11.part3'];const ps=await Promise.all(files.map(x=>fetch(x+'?v=20260911-combo1',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Terminal-Datei '+x+' konnte nicht geladen werden');return r.text()})));const b=ps.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('class="btn secondary hidden" id="backAdmin"','class="btn secondary" id="backAdmin"').replace('← Admin Center','← Zurück zum Admin Center');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><h2>Tipp-Terminal konnte nicht geladen werden</h2><p>'+String(e.message||e)+'</p><p>Bitte Strg+F5 drücken.</p></div>'}})();</script></body></html>

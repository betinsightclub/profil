<!-- BETINSIGHT APP NOINDEX END --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061d2a"><title>BetInsight – Tippbereich</title><style>body{margin:0;background:#061d2a;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.load{padding:30px;text-align:center}.spin{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#16a8f5;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#persistentBack{position:fixed;top:12px;left:12px;z-index:99999;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border-radius:999px;background:#0d3347;border:1px solid rgba(0,218,255,.45);color:#fff;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.28)}#persistentBack:hover,#persistentBack:focus{background:#12455f;outline:none}@media(max-width:600px){#persistentBack{top:8px;left:8px;padding:9px 12px;font-size:13px}}</style></head><body><a id="persistentBack" href="/admin/">← Zurück zum Admin Center</a><div class="load"><div class="spin"></div><strong>BetInsight Tipp-Terminal · Kombi wird geladen …</strong></div><script>(async()=>{try{const files=['livev11.part0','livev11.part1','livev11.part2','livev11.part3'];const ps=await Promise.all(files.map(x=>fetch(x+'?v=20260912-combo2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Terminal-Datei '+x+' konnte nicht geladen werden');return r.text()})));const b=ps.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replace('class="btn secondary hidden" id="backAdmin"','class="btn secondary" id="backAdmin"').replace('← Admin Center','← Zurück zum Admin Center');html=html.replace('<body>','<body><a id="persistentBack" href="/admin/" style="position:fixed;top:12px;left:12px;z-index:99999;display:inline-flex;align-items:center;justify-content:center;padding:10px 15px;border-radius:999px;background:#0d3347;border:1px solid rgba(0,218,255,.45);color:#fff;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.28)">← Zurück zum Admin Center</a>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<a id="persistentBack" href="/admin/" style="position:fixed;top:12px;left:12px;z-index:99999;padding:10px 15px;border-radius:999px;background:#0d3347;border:1px solid rgba(0,218,255,.45);color:#fff;text-decoration:none;font-weight:700">← Zurück zum Admin Center</a><div class="load"><h2>Tipp-Terminal konnte nicht geladen werden</h2><p>'+String(e.message||e)+'</p><p>Bitte neu laden.</p></div>'}})();</script></body></html>

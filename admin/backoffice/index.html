<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>BetInsight – Mein Backoffice</title>
</head>
<body>
  <div id="backofficeLoadState" style="font-family:Arial,sans-serif;padding:24px;background:#061d2a;color:#fff;min-height:100vh">
    Sicheres Backoffice wird geladen …
  </div>

  <script>
    (async function () {
      try {
        const response = await fetch("./index-core-20260905.html?v=20260905-1", { cache: "no-store" });
        if (!response.ok) throw new Error("Backoffice-Kern konnte nicht geladen werden (HTTP " + response.status + ").");
        const coreHtml = await response.text();
        const walletApprovalScript = '<scr' + 'ipt src="./wallet-approval.js?v=20260906-1"></scr' + 'ipt>';
        const premiumScript = '<scr' + 'ipt src="./premium-eingaenge.js?v=20260905-2"></scr' + 'ipt>';
        const marker = '<!-- WALLET-FREIGABE-MASTER · PREMIUM-EINGAENGE-LIVE · Kernstand 2026-09-05 unverändert eingebunden -->';
        const composed = coreHtml.replace(/<\/body>/i, walletApprovalScript + premiumScript + marker + "</body>");
        document.open();
        document.write(composed);
        document.close();
      } catch (error) {
        const state = document.getElementById("backofficeLoadState");
        if (state) {
          state.innerHTML = "<strong>Backoffice konnte nicht geladen werden.</strong><br><br>" +
            String(error && error.message ? error.message : error);
        }
      }
    })();
  </script>
</body>
</html>

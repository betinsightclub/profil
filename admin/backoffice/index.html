<!DOCTYPE html>
<html lang="de">
<head>
<!-- BETINSIGHT APP NOINDEX START -->
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<!-- BETINSIGHT APP NOINDEX END -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BetInsight – Mein Backoffice</title>
</head>
<body>
  <div id="backofficeLoadState" style="font-family:Arial,sans-serif;padding:24px;background:#061d2a;color:#fff;min-height:100vh">
    Sicheres Backoffice wird geladen …
  </div>

  <script>
    (async function () {
      try {
        const response = await fetch("./index-core-20260905.html?v=20260912-2", { cache: "no-store" });
        if (!response.ok) throw new Error("Backoffice-Kern konnte nicht geladen werden (HTTP " + response.status + ").");
        const coreHtml = await response.text();

        const referralDirectLink = '<a class="link-button" href="./referral-units.html?v=20260912-2" title="Referral-Unit-Verdienste öffnen">🧾 Referral-Units</a>';
        const enhancedCore = coreHtml.replace('<div class="top-actions">', '<div class="top-actions">' + referralDirectLink);

        const walletApprovalScript = '<scr' + 'ipt src="./wallet-approval.js?v=20260906-1"></scr' + 'ipt>';
        const premiumScript = '<scr' + 'ipt src="./premium-eingaenge.js?v=20260905-2"></scr' + 'ipt>';
        const adminUnitCreditScript = '<scr' + 'ipt src="./admin-unit-credit.js?v=20260911-1"></scr' + 'ipt>';
        const networkMoveScript = '<scr' + 'ipt src="./network-move.js?v=20260911-1"></scr' + 'ipt>';
        const minimumEurLabelScript = '<scr' + 'ipt src="./minimum-eur-label.js?v=20260911-1"></scr' + 'ipt>';
        const referralUnitHistoryScript = '<scr' + 'ipt src="./referral-unit-history.js?v=20260912-2"></scr' + 'ipt>';
        const marker = '<!-- WALLET-FREIGABE-MASTER · PREMIUM-EINGAENGE-LIVE · ADMIN-UNIT-GUTSCHRIFT-MASTER · NETZWERK-STRUKTUR-MOVE-MASTER · MINIMUM-EUR-LABEL · REFERRAL-UNIT-HISTORY · Kernstand 2026-09-05 unverändert eingebunden -->';
        const composed = enhancedCore.replace(/<\/body>/i, walletApprovalScript + premiumScript + adminUnitCreditScript + networkMoveScript + minimumEurLabelScript + referralUnitHistoryScript + marker + "</body>");
        document.open();
        document.write(composed);
        document.close();
      } catch (error) {
        const state = document.getElementById("backofficeLoadState");
        if (state) {
          state.innerHTML = "<strong>Backoffice konnte nicht geladen werden.</strong><br><br>" +
            String(error && error.message ? error.message : error);
        }
      }
    })();
  </script>
</body>
</html>

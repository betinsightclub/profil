<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>BetInsight – Premium-Eingänge Vorschau</title>
</head>
<body>
  <div id="previewLoadState" style="font-family:Arial,sans-serif;padding:24px;background:#061d2a;color:#fff;min-height:100vh">
    Sichere Backoffice-Vorschau wird geladen …
  </div>

  <script>
    (async function () {
      try {
        const response = await fetch("./index.html", { cache: "no-store" });
        if (!response.ok) throw new Error("LIVE-Backoffice konnte nicht geladen werden (HTTP " + response.status + ").");
        const liveHtml = await response.text();
        const premiumScript = '<scr' + 'ipt src="./premium-eingaenge.js?v=20260905-1"></scr' + 'ipt>';
        const previewMarker = '<!-- PREMIUM-EINGAENGE-PREVIEW · verändert das LIVE-index.html nicht -->';
        const composed = liveHtml.replace(/<\/body>/i, premiumScript + previewMarker + "</body>");
        document.open();
        document.write(composed);
        document.close();
      } catch (error) {
        const state = document.getElementById("previewLoadState");
        if (state) {
          state.innerHTML = "<strong>Vorschau konnte nicht geladen werden.</strong><br><br>" +
            String(error && error.message ? error.message : error);
        }
      }
    })();
  </script>
</body>
</html>

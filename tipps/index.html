  .empty,

<body>

<a
  class="floating-back-btn"
  href="https://betinsight.systeme.io/school/course/mitglieder/lecture/9870726"
>
  ⬅ Mitgliederbereich
</a>

<div class="page">

  <section class="hero">
    <div class="hero-inner">
      <img
        src="../logo_betisight.club.png"
        alt="BetInsight Club"
        class="logo"
      >

      <h1>🔥 Neue BetInsight Tipps</h1>

      <p class="subtitle">
        Hier siehst du alle aktuell veröffentlichten Tipps als Vorschau.
        Zunächst werden die neuesten 10 Tipps angezeigt.
      </p>
    </div>
  </section>

  <div id="status" class="status">
    Tipps werden geladen...
  </div>

  <div id="tips" class="tips-grid"></div>

  <div id="paginationPanel" class="pagination-panel">
    <p id="paginationCount" class="pagination-count"></p>

    <button
      id="loadMoreButton"
      class="btn load-more-btn"
      type="button"
    >
      Weitere 10 Tipps anzeigen
    </button>
  </div>

</div>

<script>
const TIPPS_WEBHOOK =
  "https://hook.eu1.make.com/36gm8kvlfcb7jwae8ypxe8oripquonq5";

const FREISCHALTEN_WEBHOOK =
  "https://hook.eu1.make.com/k1qn9hlfqd7yhz55vwiotkojgpuqzxug";

const TOKEN_STORAGE_KEY = "betinsight_profile_token";

const PAGE_SIZE = 10;

let loadedTipps = [];
let visibleTipCount = 0;

function normalizeToken(value) {
  return String(value || "").trim();
}

function getToken() {
  const params = new URLSearchParams(window.location.search);
  const tokenFromUrl = params.get("token");

  if (tokenFromUrl && tokenFromUrl.trim() !== "") {
    const normalizedToken = normalizeToken(tokenFromUrl);

    localStorage.setItem(
      TOKEN_STORAGE_KEY,
      normalizedToken
    );

    return normalizedToken;
  }

  const savedToken =
    localStorage.getItem(TOKEN_STORAGE_KEY);

  return normalizeToken(savedToken);
}

function safeText(value, fallback = "-") {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return fallback;
  }

  return String(value);
}

function escapeHtml(value) {
  return safeText(value, "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(value) {
  if (!value) {
    return "-";
  }

  const date = new Date(value);

  if (!isNaN(date.getTime())) {
    return date.toLocaleDateString("de-DE");
  }

  return value;
}

function parseWebhookJson(rawText) {
  let cleaned =
    String(rawText)
      .replace(/^\uFEFF/, "")
      .trim();

  const firstBracket = cleaned.indexOf("[");
  const lastBracket = cleaned.lastIndexOf("]");

  if (
    firstBracket !== -1 &&
    lastBracket !== -1 &&
    lastBracket > firstBracket
  ) {
    cleaned =
      cleaned
        .substring(firstBracket, lastBracket + 1)
        .trim();
  }

  return JSON.parse(cleaned);
}

function parseUnlockResponse(rawText) {
  const cleaned =
    String(rawText)
      .replace(/^\uFEFF/, "")
      .trim();

  if (!cleaned) {
    throw new Error(
      "Der Server hat keine Antwort zurückgegeben."
    );
  }

  if (
    cleaned === "Accepted" ||
    cleaned.startsWith("Accepted")
  ) {
    throw new Error(
      "Make hat nur „Accepted“ zurückgegeben. " +
      "Das Szenario wurde nicht bis zu einer JSON-Antwort ausgeführt."
    );
  }

  try {
    return JSON.parse(cleaned);
  } catch (error) {
    throw new Error(
      "Die Serverantwort ist kein gültiges JSON.\n\n" +
      "Antwort:\n" +
      cleaned
    );
  }
}

function createTipCard(tipp) {
  const card = document.createElement("article");
  card.className = "tip-card";

  const tippId =
    safeText(tipp.tipp_id, "");

  const spiel =
    safeText(tipp.spiel);

  const liga =
    safeText(tipp.liga);

  const markt =
    safeText(tipp.markt);

  const quote =
    safeText(tipp.quote);

  const preisUnits =
    safeText(tipp.preis_units);

  const spielDatum =
    formatDate(tipp.spiel_datum);

  const anpfiff =
    safeText(tipp.anpfiff);

  const ersteller =
    safeText(tipp.ersteller, "System");

  card.innerHTML = `
    <div class="tip-inner">

      <div class="badge">
        🔒 Premium-Vorschau
      </div>

      <h2>
        ${escapeHtml(spiel)}
      </h2>

      <div class="tip-meta">

        <span class="meta-item">
          👤 Tippgeber: ${escapeHtml(ersteller)}
        </span>

        <span class="meta-item">
          🏆 ${escapeHtml(liga)}
        </span>

        <span class="meta-item">
          📅 ${escapeHtml(spielDatum)}
        </span>

        <span class="meta-item">
          ⏰ ${escapeHtml(anpfiff)}
        </span>

        <span class="meta-item">
          📊 ${escapeHtml(markt)}
        </span>

        <span class="meta-item">
          📈 Quote ${escapeHtml(quote)}
        </span>

      </div>

      <div class="locked">
        Tipp und Analyse sind erst nach erfolgreicher
        Freischaltung sichtbar.
      </div>

      <div class="price">
        💎 ${escapeHtml(preisUnits)} Units
      </div>

      <br>

      <button class="btn unlock-button" type="button">
        Freischalten
      </button>

      <div class="small-note">
        Die vollständige Analyse wird nur für diesen Benutzer
        nach Freischaltung angezeigt.
      </div>

      <div class="unlock-result"></div>

    </div>
  `;

  const button =
    card.querySelector(".unlock-button");

  button.addEventListener(
    "click",
    function () {
      freischalten(
        tippId,
        card,
        button
      );
    }
  );

  return card;
}

function updatePagination() {
  const paginationPanel =
    document.getElementById("paginationPanel");

  const paginationCount =
    document.getElementById("paginationCount");

  const loadMoreButton =
    document.getElementById("loadMoreButton");

  if (loadedTipps.length === 0) {
    paginationPanel.style.display = "none";
    return;
  }

  paginationPanel.style.display = "block";

  const shown =
    Math.min(visibleTipCount, loadedTipps.length);

  if (shown >= loadedTipps.length) {
    paginationCount.innerHTML = `
      <span class="all-loaded">
        Alle ${loadedTipps.length} Tipps werden angezeigt.
      </span>
    `;

    loadMoreButton.style.display = "none";
    return;
  }

  paginationCount.textContent =
    shown +
    " von " +
    loadedTipps.length +
    " Tipps werden angezeigt.";

  const remaining =
    loadedTipps.length - shown;

  const nextAmount =
    Math.min(PAGE_SIZE, remaining);

  loadMoreButton.textContent =
    "Weitere " +
    nextAmount +
    " Tipps anzeigen";

  loadMoreButton.style.display = "inline-flex";
}

function renderNextTipps() {
  const tipsBox =
    document.getElementById("tips");

  const nextTipps =
    loadedTipps.slice(
      visibleTipCount,
      visibleTipCount + PAGE_SIZE
    );

  nextTipps.forEach(tipp => {
    tipsBox.appendChild(
      createTipCard(tipp)
    );
  });

  visibleTipCount += nextTipps.length;

  updatePagination();
}

async function loadTipps() {
  const statusBox =
    document.getElementById("status");

  const tipsBox =
    document.getElementById("tips");

  const paginationPanel =
    document.getElementById("paginationPanel");

  try {
    const response =
      await fetch(
        TIPPS_WEBHOOK +
        "?cachebuster=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );

    const rawText =
      await response.text();

    if (!response.ok) {
      throw new Error(
        "HTTP Fehler: " +
        response.status +
        "\n\nAntwort:\n" +
        rawText
      );
    }

    const tipps =
      parseWebhookJson(rawText);

    statusBox.style.display = "none";
    tipsBox.innerHTML = "";
    paginationPanel.style.display = "none";

    if (
      !Array.isArray(tipps) ||
      tipps.length === 0
    ) {
      tipsBox.innerHTML = `
        <div class="empty">
          Aktuell sind keine neuen Tipps verfügbar.
        </div>
      `;

      return;
    }

    loadedTipps = tipps;
    visibleTipCount = 0;

    renderNextTipps();

  } catch (error) {
    statusBox.style.display = "none";
    paginationPanel.style.display = "none";

    tipsBox.innerHTML = `
      <div class="error">
Fehler beim Laden der Tipps:

${escapeHtml(error.message)}
      </div>
    `;

    console.error(error);
  }
}

async function freischalten(
  tippId,
  card,
  button
) {
  const token =
    getToken();

  const resultBox =
    card.querySelector(".unlock-result");

  resultBox.innerHTML = "";

  if (!token) {
    resultBox.innerHTML = `
      <div class="error">
Kein Zugangscode gefunden.

Bitte öffne die Seite über deinen persönlichen Profil-Link.
      </div>
    `;

    return;
  }

  if (!tippId) {
    resultBox.innerHTML = `
      <div class="error">
Keine Tipp-ID gefunden.
      </div>
    `;

    return;
  }

  button.disabled = true;
  button.textContent =
    "Wird freigeschaltet...";

  try {
    const url =
      FREISCHALTEN_WEBHOOK +
      "?token=" +
      encodeURIComponent(token) +
      "&tipp_id=" +
      encodeURIComponent(tippId) +
      "&cachebuster=" +
      Date.now();

    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    const rawText =
      await response.text();

    if (!response.ok) {
      throw new Error(
        "HTTP Fehler: " +
        response.status +
        "\n\nAntwort:\n" +
        rawText
      );
    }

    const data =
      parseUnlockResponse(rawText);

    if (
      data.status ===
      "not_enough_units"
    ) {
      resultBox.innerHTML = `
        <div class="error">
Nicht genug Units.

Aktuelle Units: ${escapeHtml(data.units)}
Benötigt: ${escapeHtml(data.required)}
        </div>
      `;

      return;
    }

    if (
      data.status ===
      "units_source_missing"
    ) {
      const serverMessage =
        safeText(
          data.message,
          "Der Unit-Bestand ist vorhanden, aber keiner aktiven Kaufbuchung zugeordnet."
        );

      resultBox.innerHTML = `
        <div class="error">
Die Units können aktuell nicht eindeutig zugeordnet werden.

Aktuelle Units: ${escapeHtml(data.units)}
Benötigt: ${escapeHtml(data.required)}

${escapeHtml(serverMessage)}

Bitte wende dich an den BetInsight-Support, damit der Unit-Bestand geprüft wird.
        </div>
      `;

      return;
    }

    if (
      data.status === "success" ||
      data.status === "already_unlocked"
    ) {
      const isAlreadyUnlocked =
        data.status ===
        "already_unlocked";

      const message =
        isAlreadyUnlocked
          ? "Dieser Tipp war bereits für dich freigeschaltet."
          : "Freischaltung erfolgreich.";

      const messageClass =
        isAlreadyUnlocked
          ? "info"
          : "success";

      resultBox.innerHTML = `
        <div class="unlock-message ${messageClass}">
          ${escapeHtml(message)}
        </div>

        <div class="unlock-box">

          <h3>
            ✅ Freigeschalteter Tipp
          </h3>

          <p>
            <strong>Spiel:</strong>
            ${escapeHtml(data.spiel)}
          </p>

          <p>
            <strong>Tipp:</strong>
            ${escapeHtml(data.tipp)}
          </p>

          <p>
            <strong>Quote:</strong>
            ${escapeHtml(data.quote)}
          </p>

          <p>
            <strong>Ersteller:</strong>
            ${escapeHtml(data.ersteller)}
          </p>

          <p>
            <strong>Verbleibende Units:</strong>
            ${escapeHtml(data.units)}
          </p>

          <div class="analysis-text">
            <strong>Analyse:</strong>
            <br><br>
            ${escapeHtml(data.analyse)}
          </div>

        </div>
      `;

      return;
    }

    resultBox.innerHTML = `
      <div class="error">
Unbekannte Antwort vom Server:

${escapeHtml(rawText)}
      </div>
    `;

  } catch (error) {
    resultBox.innerHTML = `
      <div class="error">
Fehler beim Freischalten:

${escapeHtml(error.message)}
      </div>
    `;

    console.error(error);

  } finally {
    button.disabled = false;
    button.textContent =
      "Freischalten";
  }
}

document
  .getElementById("loadMoreButton")
  .addEventListener("click", renderNextTipps);

loadTipps();
</script>

</body>
</html>

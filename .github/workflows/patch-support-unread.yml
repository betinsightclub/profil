name: Patch support unread highlight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-support-unread.yml'

permissions:
  contents: write

jobs:
  patch-support:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Highlight unread support tickets
        shell: python
        run: |
          from pathlib import Path

          p = Path('support/index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace(
              '<!-- BetInsight Support | Version 2026.08.22-02 | UUID session isolation -->',
              '<!-- BetInsight Support | Version 2026.08.23-01 | UUID session isolation + unread highlight -->',
              1
          )

          old_css = '.ticket{width:100%;padding:16px;border:1px solid var(--l);border-radius:16px;background:linear-gradient(145deg,#081823,#0f2634);color:#fff;text-align:left;cursor:pointer}.tickettop{display:flex;justify-content:space-between;gap:12px}.tickettitle{font-weight:900}.ticketid{display:block;color:#6f8797;font-size:.72rem;margin-top:5px}.pill{padding:6px 9px;border-radius:999px;border:1px solid rgba(37,230,167,.28);color:var(--g);font-size:.68rem;font-weight:900}.pill.closed{color:#c2ced7;border-color:rgba(194,206,215,.22)}'
          new_css = '.ticket{width:100%;padding:16px;border:1px solid var(--l);border-radius:16px;background:linear-gradient(145deg,#081823,#0f2634);color:#fff;text-align:left;cursor:pointer;transition:.16s ease}.ticket:hover{transform:translateY(-1px);border-color:rgba(89,168,255,.42)}.ticket.unread{border:2px solid rgba(255,107,125,.9);background:linear-gradient(145deg,rgba(255,107,125,.10),#0f2634 58%);box-shadow:0 0 0 3px rgba(255,107,125,.09),0 12px 30px rgba(255,107,125,.10)}.tickettop{display:flex;justify-content:space-between;gap:12px}.tickettitle{font-weight:900}.ticket.unread .tickettitle{color:#fff}.ticketid{display:block;color:#6f8797;font-size:.72rem;margin-top:5px}.ticketbadges{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.newanswer{padding:6px 9px;border-radius:999px;background:var(--r);color:#fff;font-size:.68rem;font-weight:950;letter-spacing:.02em;box-shadow:0 0 18px rgba(255,107,125,.28)}.pill{padding:6px 9px;border-radius:999px;border:1px solid rgba(37,230,167,.28);color:var(--g);font-size:.68rem;font-weight:900}.pill.closed{color:#c2ced7;border-color:rgba(194,206,215,.22)}'
          if old_css not in html:
              raise SystemExit('CSS anchor not found')
          html = html.replace(old_css, new_css, 1)

          old_card = 'function card(t,c){const b=document.createElement("button");b.className="ticket";b.type="button";const top=document.createElement("div");top.className="tickettop";const l=document.createElement("div"),ti=document.createElement("div"),id=document.createElement("span");ti.className="tickettitle";ti.textContent=clean(t.betreff)||"Support-Ticket";id.className="ticketid";id.textContent=clean(t.ticket_id);l.append(ti,id);const p=document.createElement("span");p.className="pill"+(c?" closed":"");p.textContent=c?"GESCHLOSSEN":(clean(t.status)||"OFFEN");top.append(l,p);const m=document.createElement("div");m.className="meta";m.textContent="🕒 "+fmt(t.letzte_nachricht_am||t.aktualisiert_am||t.erstellt_am)+(t.kategorie?" · 🏷 "+clean(t.kategorie):"");b.append(top,m);b.onclick=()=>openThread(clean(t.ticket_id));return b}'
          new_card = 'function card(t,c){const unread=Math.max(0,Math.floor(Number(t.user_ungelesen)||0)),b=document.createElement("button");b.className="ticket"+(unread>0?" unread":"");b.type="button";const top=document.createElement("div");top.className="tickettop";const l=document.createElement("div"),ti=document.createElement("div"),id=document.createElement("span");ti.className="tickettitle";ti.textContent=clean(t.betreff)||"Support-Ticket";id.className="ticketid";id.textContent=clean(t.ticket_id);l.append(ti,id);const badges=document.createElement("div");badges.className="ticketbadges";if(unread>0){const n=document.createElement("span");n.className="newanswer";n.textContent=unread===1?"NEUE ANTWORT":unread+" NEUE ANTWORTEN";badges.append(n)}const p=document.createElement("span");p.className="pill"+(c?" closed":"");p.textContent=c?"GESCHLOSSEN":(clean(t.status)||"OFFEN");badges.append(p);top.append(l,badges);const m=document.createElement("div");m.className="meta";m.textContent="🕒 "+fmt(t.letzte_nachricht_am||t.aktualisiert_am||t.erstellt_am)+(t.kategorie?" · 🏷 "+clean(t.kategorie):"");b.append(top,m);b.onclick=()=>openThread(clean(t.ticket_id));return b}'
          if old_card not in html:
              raise SystemExit('card() anchor not found')
          html = html.replace(old_card, new_card, 1)

          checks = [
              'Version 2026.08.23-01',
              '.ticket.unread{',
              'className="newanswer"',
              'NEUE ANTWORT',
              'Number(t.user_ungelesen)'
          ]
          missing = [x for x in checks if x not in html]
          if missing:
              raise SystemExit('Sanity checks failed: ' + repr(missing))

          p.write_text(html, encoding='utf-8')
          print('Unread ticket highlighting patched.')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add support/index.html
          git rm .github/workflows/patch-support-unread.yml
          git commit -m "ui: highlight unread support replies"
          git push

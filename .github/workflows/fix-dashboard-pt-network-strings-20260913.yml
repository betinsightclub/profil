name: Fix dashboard PT network strings 2026-09-13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-dashboard-pt-network-strings-20260913.yml

permissions:
  contents: write

jobs:
  patch-dashboard-pt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PT network strings
        run: python3 .github/scripts/fix_dashboard_pt_network_strings_20260913.py
      - name: Validate JSON
        run: |
          python3 -m json.tool assets/i18n/pages/dashboard/de.json >/dev/null
          python3 -m json.tool assets/i18n/pages/dashboard/pt.json >/dev/null
          grep -q 'Visão geral da rede e indicações' assets/i18n/pages/dashboard/pt.json
          grep -q 'Parceiros no total' assets/i18n/pages/dashboard/pt.json
          git diff --check
      - name: Commit PT network strings
        run: |
          git config user.name "BetInsight i18n Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/i18n/pages/dashboard/de.json assets/i18n/pages/dashboard/pt.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "i18n: complete visible Portuguese network labels"
          git push

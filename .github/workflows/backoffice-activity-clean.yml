name: Backoffice activity cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 tools/backoffice_activity_cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Backoffice: remove mock activity and empty-wallet event"
          git push

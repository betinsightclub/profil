name: One-off Admin Live URL update

on:
  push:
    paths:
      - ".github/workflows/oneoff-admin-live-url.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update admin live URL comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'Live-Seite: https://betinsightclub.github.io/profil/admin/'
          new = 'Live-Seite: https://app.betinsight.club/admin/'

          if old not in text:
              raise SystemExit('FEHLER: Alte Live-Seite-Zeile nicht gefunden.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          if old in text:
              raise SystemExit('FEHLER: Alte Live-Seite-Zeile ist noch vorhanden.')
          if new not in text:
              raise SystemExit('FEHLER: Neue Live-Seite-Zeile fehlt.')

          print('OK: Admin Live-Seite auf app.betinsight.club aktualisiert.')
          PY

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "BetInsight Website Builder"
          git config user.email "actions@github.com"
          git rm .github/workflows/oneoff-admin-live-url.yml
          git add admin/index.html
          git diff --check
          git commit -m "Admin: Live-URL auf app.betinsight.club aktualisieren"
          git push

name: Patch cost planning line v1

on:
  push:
    paths:
      - '.github/workflows/patch-cost-planning-line-v1.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_cost_planning_line_v1.py
      - name: Commit patch
        run: |
          git config user.name 'BetInsight Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin/backoffice/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show booked and planned operating costs separately'
          git push

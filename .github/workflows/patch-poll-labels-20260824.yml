name: Patch Wechselstube Poll Labels

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-poll-labels-20260824.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update poll labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('wechselboerse/angebote/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Version: 2.2 PILOT-LIVE AUTO-CONFIRM COUNTDOWN', 'Version: 2.3 PILOT-LIVE AUTO-CONFIRM FINAL POLL LABELS')
          s = s.replace('- während der Wartephasen gelb/orange pulsierende Statusanzeige mit sekündlichem Countdown\n- erst echte Abweichungen werden rot als Fehler behandelt', '- während der Wartephasen gelb/orange pulsierende Statusanzeige mit sekündlichem Countdown\n- jede Wartephase zeigt klar, welche Prüfung abgeschlossen ist und welche Prüfung als Nächstes folgt\n- nach Prüfung 5 von 5 wird der Abschluss der automatischen Prüfrunde eindeutig angezeigt\n- erst echte Abweichungen werden rot als Fehler behandelt')
          old = '''async function waitForNextTxidPoll(targetTime){setTxidPollingVisual(true);while(txidPolling){const remaining=Number(targetTime)-Date.now();if(remaining<=0)break;const sec=Math.max(1,Math.ceil(remaining/1000));el.txidCheckButton.textContent=`Nächste Prüfung in ${sec} s`;setTxidResult("warn",`Zahlung wurde gemeldet. Die Blockchain-Bestätigung läuft. Nächste automatische Prüfung in ${sec} ${secondsLabel(sec)}. Bitte nicht erneut zahlen und die Seite geöffnet lassen.`,true);await sleep(Math.min(250,remaining))}}'''
          new = '''async function waitForNextTxidPoll(targetTime,nextCheckNumber){setTxidPollingVisual(true);while(txidPolling){const remaining=Number(targetTime)-Date.now();if(remaining<=0)break;const sec=Math.max(1,Math.ceil(remaining/1000));const completed=Math.max(0,nextCheckNumber-1);el.txidCheckButton.textContent=`Prüfung ${nextCheckNumber} von ${TXID_POLL_SCHEDULE.length} in ${sec} s`;setTxidResult("warn",`${completed>0?`Prüfung ${completed} von ${TXID_POLL_SCHEDULE.length} abgeschlossen. `:"Zahlung wurde gemeldet. "}Nächste Prüfung ${nextCheckNumber} von ${TXID_POLL_SCHEDULE.length} in ${sec} ${secondsLabel(sec)}. Bitte nicht erneut zahlen und die Seite geöffnet lassen.`,true);await sleep(Math.min(250,remaining))}}'''
          if old not in s:
              raise SystemExit('waitForNextTxidPoll block not found')
          s = s.replace(old, new)
          s = s.replace('await waitForNextTxidPoll(target);', 'await waitForNextTxidPoll(target,i+1);')
          s = s.replace('setTxidResult("warn",`Blockchain-Bestätigung wird geprüft … Prüfung ${i+1} von ${TXID_POLL_SCHEDULE.length}. Bitte Seite geöffnet lassen.`,true);', 'setTxidResult("warn",`Prüfung ${i+1} von ${TXID_POLL_SCHEDULE.length} läuft … Blockchain-Bestätigung wird geprüft. Bitte Seite geöffnet lassen.`,true);')
          s = s.replace('Die Blockchain-Bestätigung dauert länger als üblich. Es wurde nichts doppelt gebucht. Klicke auf „Erneut prüfen“, um eine neue automatische Prüfrunde zu starten.', '5 automatische Prüfungen abgeschlossen. Die Blockchain-Bestätigung ist noch nicht verfügbar. Es wurde nichts doppelt gebucht. Klicke auf „Erneut prüfen“, um eine neue automatische Prüfrunde zu starten.')
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wechselboerse/angebote/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Clarify final TXID poll labels"
          git push origin main

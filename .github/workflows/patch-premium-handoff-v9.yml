name: Patch Premium Network handoff v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-premium-handoff-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch Premium Network navigation to same-tab one-time handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          nav=Path('assets/app-navigation-v2.js')
          s=nav.read_text(encoding='utf-8')
          start=s.index('      case "premium-provisionen": {')
          end=s.index('      default: break;',start)
          block='''      case "premium-provisionen": {\n        showMessage(t("session.networkOpening", "Premium & Network wird sicher geöffnet …"));\n        loadScript("premium-network-handoff.js?v=20260830-9", "BetInsightPremiumNetworkHandoff")\n          .then(async () => {\n            const started = await window.BetInsightPremiumNetworkHandoff?.start?.();\n            if (!started) {\n              if (!session()?.hasDashboardAccess()) {\n                window.location.assign(session().appPath("konto") + "?next=premium-provisionen");\n              } else {\n                showMessage(t("session.networkHandoffError", "Premium & Network konnte gerade nicht geöffnet werden. Bitte versuche es erneut."));\n              }\n            }\n          })\n          .catch(() => showMessage(t("session.networkHandoffError", "Premium & Network konnte gerade nicht geöffnet werden. Bitte versuche es erneut.")));\n        break;\n      }\n'''
          s=s[:start]+block+s[end:]
          nav.write_text(s,encoding='utf-8')

          account=Path('konto/index.html')
          s=account.read_text(encoding='utf-8')
          s=s.replace('Stand: 30.08.2026-04 · Premium-Network-Handoff per Einmalcode','Stand: 30.08.2026-05 · Premium-Network-Handoff per Einmalcode im selben Tab')
          s=s.replace('premium-network-handoff.js?v=20260830-8','premium-network-handoff.js?v=20260830-9')
          bstart=s.index('        if(next === "premium-provisionen"){')
          bend=s.index('\n        if(next && next!=="dashboard")',bstart)
          block='''        if(next === "premium-provisionen"){\n          const dashboardToken=savedDashboard();\n          if(!dashboardToken){\n            status.className="status missing";\n            status.textContent=i18n.t("account.networkAccessMissing",{},"Der bestätigte Dashboard-Zugang fehlt auf diesem Gerät. Bitte öffne zuerst dein BetInsight Dashboard über deinen aktuellen Profil-Link und lade diese Seite danach neu.");\n            return false;\n          }\n          status.className="status ok";\n          status.textContent=i18n.t("account.networkOpening",{},"Premium & Network wird sicher geöffnet …");\n          const started=await window.BetInsightPremiumNetworkHandoff?.start?.();\n          if(started){\n            removeSaved(NEXT_KEY);\n            return true;\n          }\n          status.className="status missing";\n          status.textContent=i18n.t("account.networkOpenError",{},"Premium & Network konnte gerade nicht geöffnet werden. Bitte versuche es erneut.");\n          return false;\n        }\n'''
          s=s[:bstart]+block+s[bend:]
          account.write_text(s,encoding='utf-8')

          compat=Path('assets/app-navigation.js')
          s=compat.read_text(encoding='utf-8')
          for old in ['app-navigation-v2.js?v=20260830-8','app-navigation-v2.js?v=20260830-7','app-navigation-v2.js?v=20260830-4']:
              s=s.replace(old,'app-navigation-v2.js?v=20260830-9')
          for old in ['premium-network-handoff.js?v=20260830-8','premium-network-handoff.js?v=20260830-7','premium-network-handoff.js?v=20260830-6','premium-network-handoff.js?v=20260830-4']:
              s=s.replace(old,'premium-network-handoff.js?v=20260830-9')
          compat.write_text(s,encoding='utf-8')

          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              txt=p.read_text(encoding='utf-8')
              new=txt
              for old in ['app-navigation-v2.js?v=20260830-8','app-navigation-v2.js?v=20260830-7','app-navigation-v2.js?v=20260830-4']:
                  new=new.replace(old,'app-navigation-v2.js?v=20260830-9')
              if new!=txt: p.write_text(new,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name "betinsight-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-premium-handoff-v9.yml
          git add -A
          git commit -m "Use same-tab one-time Premium Network handoff"
          git push

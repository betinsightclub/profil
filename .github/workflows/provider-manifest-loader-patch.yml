name: Apply provider manifest loader patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-manifest-loader-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Patch provider loader
        shell: python
        run: |
          from pathlib import Path

          path = Path('anbieter/index.html')
          text = path.read_text(encoding='utf-8')

          old_const = "    const WEB_BATCH_URL = '../assets/provider-whitelist-web-batch.json?v=20260831-1';"
          new_const = "    const BATCH_MANIFEST_URL = '../assets/provider-whitelist-batches.json?v=20260831-1';"
          if old_const not in text:
              raise SystemExit('Expected WEB_BATCH_URL constant not found; refusing to patch.')
          text = text.replace(old_const, new_const, 1)

          old_loader = '''    Promise.all([\n      fetch(DATA_URL,{cache:'no-store'}).then(response=>{ if(!response.ok) throw new Error(`Whitelist HTTP ${response.status}`); return response.json(); }),\n      fetch(WEB_BATCH_URL,{cache:'no-store'}).then(response=>{ if(!response.ok) throw new Error(`Whitelist batch HTTP ${response.status}`); return response.json(); })\n    ]).then(([baseData,webBatch])=>{\n      config=deepMerge(baseData,webBatch);\n      dataStand.textContent=formatIsoDate(config.updated);\n      populateCountries(countrySelect.value);\n      populateRegions(countrySelect.value,regionSelect.value);\n      updateConfirmState();\n      refreshLanguage();\n    }).catch(error=>{'''

          new_loader = '''    Promise.all([\n      fetch(DATA_URL,{cache:'no-store'}).then(response=>{ if(!response.ok) throw new Error(`Whitelist HTTP ${response.status}`); return response.json(); }),\n      fetch(BATCH_MANIFEST_URL,{cache:'no-store'}).then(response=>{ if(!response.ok) throw new Error(`Whitelist manifest HTTP ${response.status}`); return response.json(); })\n    ]).then(async ([baseData,manifest])=>{\n      config=baseData;\n      const files=Array.isArray(manifest?.files)?manifest.files:[];\n      for (const file of files) {\n        const url=new URL(`../assets/${file}`,location.href);\n        url.searchParams.set('v',manifest.updated||manifest.version||Date.now());\n        const response=await fetch(url,{cache:'no-store'});\n        if(!response.ok) throw new Error(`Whitelist batch HTTP ${response.status}: ${file}`);\n        config=deepMerge(config,await response.json());\n      }\n      if (manifest?.updated && (!config.updated || manifest.updated > config.updated)) config.updated=manifest.updated;\n      dataStand.textContent=formatIsoDate(config.updated);\n      populateCountries(countrySelect.value);\n      populateRegions(countrySelect.value,regionSelect.value);\n      updateConfirmState();\n      refreshLanguage();\n    }).catch(error=>{'''

          if old_loader not in text:
              raise SystemExit('Expected old loader block not found; refusing to patch.')
          text = text.replace(old_loader, new_loader, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'betinsightclub'
          git config user.email 'betinsight.club@gmail.com'
          git add anbieter/index.html
          git rm .github/workflows/provider-manifest-loader-patch.yml
          git commit -m 'Load provider whitelist batches via manifest [skip ci]'
          git push origin main

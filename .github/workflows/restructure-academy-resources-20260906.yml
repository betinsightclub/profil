name: Restructure Academy and Resources 2026-09-06

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restructure-academy-resources-20260906.yml

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current live main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded navigation patch
        run: python3 scripts/restructure_academy_resources_20260906.py

      - name: Validate and commit only targeted files
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/app-navigation.js assets/app-navigation-v2.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No navigation changes required."
            exit 0
          fi
          git commit -m "Move Academy and Resources to top-level navigation"
          git push

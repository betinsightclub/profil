name: Provider pending-label patch
on:
  push:
    paths:
      - '.github/workflows/provider-pending-label-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch provider pending subtitle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('anbieter/index.html')
          s=p.read_text()
          old="resultsSubtitle.textContent=t('providersPage.resultsSubtitle',{location:locationText,count:0},`Auswahl für ${locationText} · 0 Anbieter`);"
          new="resultsSubtitle.textContent=t('providersPage.pendingSubtitle',{location:locationText},`Prüfung für ${locationText} ausstehend`);"
          if old not in s:
              raise SystemExit('target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/provider-pending-label-patch.yml
          git config user.name 'betinsightclub'
          git config user.email 'betinsight.club@gmail.com'
          git add anbieter/index.html .github/workflows/provider-pending-label-patch.yml
          git commit -m 'Clarify pending provider checks' || exit 0
          git push origin main

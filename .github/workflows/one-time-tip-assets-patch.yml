name: One-time BetInsight Tipp asset patch

on:
  push:
    paths:
      - '.github/workflows/one-time-tip-assets-patch.yml'

permissions:
  contents: write

jobs:
  patch-tip-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nur erwartete Tipp-Asset-Referenzen ändern
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              Path('index.html'): [
                  ('<script src="assets/tip-notifications.js?v=20260905-1" defer></script>',
                   '<script src="assets/tip-notifications.js?v=20260905-4" defer></script>'),
              ],
              Path('tipps/index.html'): [
                  ('<script src="../assets/app-session.js"></script>',
                   '<script src="../assets/tip-expiry-guard.js?v=20260905-2" defer></script>\n  <script src="../assets/app-session.js?v=20260905-4"></script>'),
                  ('<script src="../assets/tip-notifications.js?v=20260905-1" defer></script>',
                   '<script src="../assets/tip-notifications.js?v=20260905-4" defer></script>'),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: Erwartete Fundstelle nicht eindeutig: {old!r} -> {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Patch speichern
        run: |
          git config user.name "BetInsight Bot"
          git config user.email "betinsight.club@gmail.com"
          git add index.html tipps/index.html
          git diff --cached --check
          git commit -m "Load current Tipp expiry and notification assets"
          git pull --rebase origin main
          git push origin main

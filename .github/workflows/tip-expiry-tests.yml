name: Tip expiry regression tests
on:
  push:
    paths:
      - 'tipps/**'
      - 'assets/tip-expiry-guard.js'
      - 'tests/tip-expiry.test.cjs'
      - '.github/workflows/tip-expiry-tests.yml'
  pull_request:
    paths:
      - 'tipps/**'
      - 'assets/tip-expiry-guard.js'
      - 'tests/tip-expiry.test.cjs'
      - '.github/workflows/tip-expiry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tip-expiry.test.cjs

name: Add tip unlock counters

on:
  push:
    paths:
      - '.github/workflows/add-unlock-counters.yml'
      - '.github/scripts/add_unlock_counters.py'

permissions:
  contents: write

jobs:
  patch-backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin backoffice
        run: python3 .github/scripts/add_unlock_counters.py
      - name: Commit unlock counters
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add tip unlock counters"
          git push

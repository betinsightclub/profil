name: Install all Querformat translations

on:
  push:
    branches:
      - querformat-sprachen-20260917
    paths:
      - .github/workflows/install-all-querformat.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: querformat-sprachen-20260917
      - name: Install and verify all translated Querformat images
        shell: bash
        run: |
          set -euo pipefail
          ZIP="marketing-center/downloads/bilder/.incoming/querformat_translations_webp_all.zip"
          DEST="marketing-center/downloads/bilder"
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d "$DEST"
          for stem in             betinsight-11-jahre-analyse-vorteil             betinsight-dir-entgeht-nichts             betinsight-mittendrin-analyse             betinsight-vorsprung-analyse-erfahrung; do
            for lang in en es fr it pt; do
              test -f "$DEST/${stem}-${lang}-querformat.webp"
            done
          done
          test -f "$DEST/betinsight-analyse-center-neutral-querformat.png"
          test -f "$DEST/betinsight-analyse-monitorplatz-neutral-querformat.png"
          test -f "$DEST/betinsight-stadion-analyse-neutral-querformat.png"
          rm -f "$ZIP"
          rm -f ".github/workflows/install-all-querformat.yml"
      - name: Commit installed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing-center/downloads/bilder .github/workflows/install-all-querformat.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m 'Install complete multilingual Querformat set'
          git push origin HEAD:querformat-sprachen-20260917

name: Academy 01 Video integrieren

on:
  push:
    paths:
      - '.github/workflows/academy-video-01.yml'

permissions:
  contents: write

jobs:
  patch-marketing-center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Video in Academy-Bereich ergänzen
        shell: python
        run: |
          from pathlib import Path

          path = Path("marketing-center/index.html")
          text = path.read_text(encoding="utf-8")

          # Versionskopf aktualisieren.
          old_head = "Version: 2026.08.27-02\nAnwendungs-Version: 1.6.1\n"
          new_head = "Version: 2026.08.27-03\nAnwendungs-Version: 1.6.2\n\nÄnderungen v1.6.2:\n- Academy #01 um offizielle YouTube-Videoanleitung ergänzt\n- Registrierung bietet nun Video ansehen, PDF ansehen und PDF herunterladen\n"
          if old_head in text:
              text = text.replace(old_head, new_head, 1)

          text = text.replace(
              '<meta name="application-version" content="1.6.1">',
              '<meta name="application-version" content="1.6.2">',
              1
          )
          text = text.replace(
              '© 2026 BetInsight Club · Marketing-Center · Version 1.6.1',
              '© 2026 BetInsight Club · Marketing-Center · Version 1.6.2',
              1
          )

          # Zentraler Video-Link für Academy 01.
          video_const = '  const ACADEMY_VIDEO_01_URL = "https://youtu.be/TthBEfLi1ZA";\n\n'
          if 'const ACADEMY_VIDEO_01_URL' not in text:
              marker = '  const PDF_EXTENSION = /\\.pdf$/i;'
              if text.count(marker) != 1:
                  raise SystemExit("PDF marker is not unique")
              text = text.replace(marker, video_const + marker, 1)

          # Beschreibung der Registrierungslektion auf Video + PDF anpassen.
          old_description = '      return "Bild-Anleitung zur Registrierung mit markierten Klickpunkten und kurzen Erklärungen. Ideal zum Nachlesen oder Weitergeben an neue Interessenten.";'
          new_description = '      return "Video- und PDF-Anleitung zur Registrierung mit kurzen Erklärungen. Ideal zum Ansehen, Nachlesen oder Weitergeben an neue Interessenten.";'
          if old_description in text:
              text = text.replace(old_description, new_description, 1)

          # Nur bei der Registrierungs-PDF den passenden YouTube-Button ergänzen.
          signature = 'video.textContent = "▶ Video ansehen";'
          if signature not in text:
              marker = '    actions.append(view, download);\n    card.append(visual, copy, actions);'
              if text.count(marker) != 1:
                  raise SystemExit("Guide actions marker is not unique")
              replacement = '''    if (/registrierung/i.test(file.name)) {
      const video = document.createElement("a");
      video.className = "presentation-button secondary";
      video.href = ACADEMY_VIDEO_01_URL;
      video.target = "_blank";
      video.rel = "noopener noreferrer";
      video.textContent = "▶ Video ansehen";
      actions.appendChild(video);
    }

    actions.append(view, download);
    card.append(visual, copy, actions);'''
              text = text.replace(marker, replacement, 1)

          if 'https://youtu.be/TthBEfLi1ZA' not in text:
              raise SystemExit("Video URL was not inserted")

          path.write_text(text, encoding="utf-8")

          # Einmal-Workflow nach erfolgreichem Patch wieder entfernen.
          workflow = Path(".github/workflows/academy-video-01.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Änderungen committen
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add marketing-center/index.html .github/workflows/academy-video-01.yml
          if git diff --cached --quiet; then
            echo "No change needed"
            exit 0
          fi
          git commit -m "Marketing-Center: Academy 01 Video verlinken"
          git push

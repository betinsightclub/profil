name: Patch shared cost transparency v1

on:
  push:
    paths:
      - '.github/workflows/patch-shared-cost-transparency-v1.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch_shared_cost_transparency_v1.py
      - name: Commit patch
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add shared operating cost transparency and next-month control"
            git push
          fi

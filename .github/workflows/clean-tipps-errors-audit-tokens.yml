name: Clean Tipps errors and audit tokens

on:
  push:
    paths:
      - '.github/workflows/clean-tipps-errors-audit-tokens.yml'
      - '.github/scripts/clean_tipps_errors_and_audit_tokens.py'

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch errors and audit token usage
        run: python3 .github/scripts/clean_tipps_errors_and_audit_tokens.py
      - name: Commit tips error cleanup
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tipps/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Clean customer-facing tips errors"
          git push

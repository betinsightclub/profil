name: Cache bust customer navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Force latest navigation assets
        run: |
          python - <<'PY'
          from pathlib import Path
          version = '20260830-4'
          changed = []
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              n = s
              n = n.replace('app-navigation-v2.js"', f'app-navigation-v2.js?v={version}"')
              n = n.replace("app-navigation-v2.js'", f"app-navigation-v2.js?v={version}'")
              n = n.replace('app-navigation.js"', f'app-navigation.js?v={version}"')
              n = n.replace("app-navigation.js'", f"app-navigation.js?v={version}'")
              if n != s:
                  p.write_text(n, encoding='utf-8')
                  changed.append(str(p))
          p = Path('assets/app-navigation.js')
          s = p.read_text(encoding='utf-8')
          n = s.replace('loadScript("app-navigation-v2.js")', f'loadScript("app-navigation-v2.js?v={version}")')
          n = n.replace('loadScript("premium-network-handoff.js","BetInsightPremiumNetworkHandoff")', f'loadScript("premium-network-handoff.js?v={version}","BetInsightPremiumNetworkHandoff")')
          if n != s:
              p.write_text(n, encoding='utf-8')
              changed.append(str(p))
          print('changed:', *changed, sep='\n')
          PY
      - name: Commit cache bust
        run: |
          git config user.name "betinsight-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add .
          git commit -m "Force fresh customer navigation assets"
          git push

name: Fix Konto Premium Network handoff

on:
  push:
    paths:
      - '.github/workflows/fix-konto-premium-network-handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch konto Premium Network handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('konto/index.html')
          text = path.read_text(encoding='utf-8')

          old_constants = '''      const PROFILE_LINK_WEBHOOK = "https://hook.eu1.make.com/me8q6ptfnno6qfji4s6348rw6f47i3t5";\n      const APP_URL = new URL(session ? session.appPath() : "/", window.location.origin).toString();'''
          new_constants = '''      const PROFILE_LINK_WEBHOOK = "https://hook.eu1.make.com/me8q6ptfnno6qfji4s6348rw6f47i3t5";\n      const APP_URL = new URL(session ? session.appPath() : "/", window.location.origin).toString();\n      const PREMIUM_NETWORK_HANDOFF_URL = "https://betinsight.network/handoff/";\n      const PREMIUM_NETWORK_HANDOFF_PREFIX = "BI_NETWORK_HANDOFF_V1:";'''
          if old_constants not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(old_constants, new_constants, 1)

          old_branch = '''        if(next === "premium-provisionen"){\n          status.className="status missing";\n          status.textContent=i18n.t("account.networkPending",{},"Der sichere Zugang zu Premium & Network wird aktuell auf eine Übergabe ohne sichtbaren Dashboard-Zugang umgestellt.");\n          return false;\n        }'''
          new_branch = '''        if(next === "premium-provisionen"){\n          const dashboardToken=savedDashboard();\n          if(!dashboardToken){\n            status.className="status missing";\n            status.textContent=i18n.t("account.networkAccessMissing",{},"Der bestätigte Dashboard-Zugang fehlt auf diesem Gerät. Bitte öffne zuerst dein BetInsight Dashboard über deinen aktuellen Profil-Link.");\n            return false;\n          }\n          try{\n            window.name=PREMIUM_NETWORK_HANDOFF_PREFIX+dashboardToken;\n            removeSaved(NEXT_KEY);\n            status.className="status ok";\n            status.textContent=i18n.t("account.networkOpening",{},"✅ Premium & Network wird sicher geöffnet …");\n            window.location.assign(PREMIUM_NETWORK_HANDOFF_URL);\n            return true;\n          }catch(e){\n            status.className="status missing";\n            status.textContent=i18n.t("account.networkOpenError",{},"Premium & Network konnte gerade nicht geöffnet werden. Bitte versuche es erneut.");\n            return false;\n          }\n        }'''
          if old_branch not in text:
              raise SystemExit('old blocker branch not found')
          text = text.replace(old_branch, new_branch, 1)

          old_auto = '      if(access&&next&&next!=="premium-provisionen") window.setTimeout(()=>goToTarget(),450);'
          new_auto = '      if(access&&next) window.setTimeout(()=>goToTarget(),450);'
          if old_auto not in text:
              raise SystemExit('auto-route anchor not found')
          text = text.replace(old_auto, new_auto, 1)

          text = text.replace('Pilot-Stand: 27.08.2026-01 · nur Feature-Branch', 'Stand: 30.08.2026-02 · Premium-Network-Handoff aktiv', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "betinsight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add konto/index.html
          git commit -m "Enable Premium Network handoff from account gateway"
          git push origin main

name: TEMP Tipp-Benachrichtigungen einbinden

on:
  repository_dispatch:
    types: [enable_tip_notifications]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Loader nur gezielt ergänzen
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path("index.html"),
                  '<script src="assets/app-navigation.js?v=20260830-7" defer></script>',
                  '<script src="assets/app-navigation.js?v=20260830-7" defer></script>\n  <script src="assets/tip-notifications.js?v=20260905-1" defer></script>'
              ),
              (
                  Path("tipps/index.html"),
                  '<script src="../assets/app-navigation-v2.js?v=20260830-9" defer></script>',
                  '<script src="../assets/app-navigation-v2.js?v=20260830-9" defer></script>\n  <script src="../assets/tip-notifications.js?v=20260905-1" defer></script>'
              )
          ]

          for path, anchor, replacement in changes:
              text = path.read_text(encoding="utf-8")
              if "tip-notifications.js?v=20260905-1" in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f"Sicherheitsabbruch: Anker fehlt in {path}")
              path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Änderung speichern
        run: |
          git config user.name "BetInsight Bot"
          git config user.email "betinsight.club@gmail.com"
          git add index.html tipps/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable Tipp notifications on profile and tips page"
          git pull --rebase origin main
          git push origin main

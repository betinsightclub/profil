name: BetInsight Wechselstube old-link canonicalization v07

on:
  push:
    paths:
      - '.github/workflows/bi-wechselstube-old-links-v07.yml'

permissions:
  contents: write

jobs:
  patch-profile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profile safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_version = 'Version: 2026.08.21-06'
          if old_version not in s:
              raise SystemExit('ABORT: expected profile v06 not found')

          s = s.replace(old_version, 'Version: 2026.08.21-07', 1)

          marker = 'Änderungen:\n'
          changelog = (
              '- ALT-LINK-KOMPATIBILITÄT WECHSELSTUBE 2026.08.21-07:\n'
              '  - Direkte alte Wechselstuben-Links werden über das bereits funktionierende Profil sicher auf den bestätigten dashboard_token kanonisiert.\n'
              '  - Neuer Deep-Link #wechselboerse wird nach erfolgreichem Profilabruf ausschließlich mit dem bestätigten dashboard_token geöffnet.\n'
              '  - Alte Profil-Tokens bleiben damit weiterhin gültig; neue UUID-Links funktionieren unverändert direkt.\n'
              '  - Keine Zahlungs-, Unit-, Wallet-, Premium-, Tipp- oder Netzwerklogik wird verändert.\n'
          )
          if marker not in s:
              raise SystemExit('ABORT: changelog marker missing')
          s = s.replace(marker, marker + changelog, 1)

          old_hash = 'return ["premium","netzwerk","wallet","tipps","kaufen","freigeschaltet"].includes(hash)?"#"+hash:"";'
          new_hash = 'return ["premium","netzwerk","wallet","tipps","kaufen","freigeschaltet","wechselboerse"].includes(hash)?"#"+hash:"";'
          if old_hash not in s:
              raise SystemExit('ABORT: supported-hash target missing')
          s = s.replace(old_hash, new_hash, 1)

          anchor = '  if(target==="freigeschaltet"){\n'
          if anchor not in s:
              raise SystemExit('ABORT: deep-link insertion anchor missing')

          block = '''  if(target==="wechselboerse"){
    const dashboardToken=String(currentProfileData.dashboardToken||"").trim();
    if(!dashboardToken){
      const msg=document.getElementById("message");
      if(msg)msg.innerText="Die Unit-Wechselstube konnte noch nicht geöffnet werden, weil der persönliche Dashboard-Zugang fehlt.";
      return;
    }
    deepLinkHandled=true;
    location.replace("https://betinsightclub.github.io/profil/wechselboerse/?token="+encodeURIComponent(dashboardToken));
    return;
  }

'''
          s = s.replace(anchor, block + anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'Version: 2026.08.21-07' index.html
          grep -q '"wechselboerse"' index.html
          grep -q 'target==="wechselboerse"' index.html
          grep -q 'profil/wechselboerse/?token=' index.html

      - name: Commit profile patch
        shell: bash
        run: |
          git config user.name 'BetInsight Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: canonicalize old Wechselstube links through profile'
          git push

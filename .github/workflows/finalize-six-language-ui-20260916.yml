name: Validate Eight-Language Member UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/i18n/**"
      - "assets/member-language-switch.js"
      - "freigeschaltet/index.html"
      - ".github/scripts/validate_member_i18n_eight_languages_20260930.py"
      - ".github/scripts/finalize_six_language_ui_20260916.py"
      - ".github/workflows/finalize-six-language-ui-20260916.yml"

permissions:
  contents: read

jobs:
  validate-eight-language-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate eight-language member UI
        run: python3 .github/scripts/validate_member_i18n_eight_languages_20260930.py

      - name: Validate locale JSON syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          for p in (root/'assets/i18n/locales').glob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in (root/'assets/i18n/pages').glob('*/*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('All locale JSON parses correctly')
          PY

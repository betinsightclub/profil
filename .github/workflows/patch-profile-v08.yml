name: Patch profile v08

on:
  push:
    paths:
      - '.github/workflows/patch-profile-v08.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch profil/index.html to v08
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          assert 'Version: 2026.08.21-07' in html
          html = html.replace('Version: 2026.08.21-07', 'Version: 2026.08.21-08', 1)

          old_header = '''Änderungen:\n- UUID-FALLBACK 2026.08.21-07:'''
          new_header = '''Änderungen:\n- SUPPORT-TOKEN-ERHALT 2026.08.21-08:\n  - Dashboard-UUID und normaler Profil-/Support-Token werden nicht mehr im selben localStorage-Feld gegeneinander überschrieben.\n  - Eine UUID aus der Profil-URL wird separat als Dashboard-Zugang gespeichert.\n  - Nach erfolgreichem Profilabruf bleibt der normale USER.token für Support und Support-Zähler erhalten.\n  - Wechselstube, Netzwerk, Wallet und freigeschaltete Tipps verwenden weiterhin den bestätigten dashboard_token.\n  - Support bleibt absichtlich ohne sichtbaren Token in der URL und nutzt weiterhin den normalen Support-kompatiblen Profilzugang.\n  - Beim Löschen des Zugangs werden jetzt beide lokalen Token-Speicher entfernt.\n  - Alle übrigen Profil-, Tipp-, Kauf-, Premium-, Referral-, Marketing- und Zahlungsfunktionen bleiben unverändert.\n- UUID-FALLBACK 2026.08.21-07:'''
          assert old_header in html
          html = html.replace(old_header, new_header, 1)

          old_const = 'const TOKEN_STORAGE_KEY="betinsight_profile_token";'
          new_const = 'const TOKEN_STORAGE_KEY="betinsight_profile_token";\nconst DASHBOARD_TOKEN_STORAGE_KEY="betinsight_dashboard_token";'
          assert old_const in html
          html = html.replace(old_const, new_const, 1)

          old_token_block = '''function getTokenFromUrl(){return new URLSearchParams(location.search).get("token")}\nfunction getSavedToken(){return localStorage.getItem(TOKEN_STORAGE_KEY)}\nfunction saveToken(token){if(token&&String(token).trim())localStorage.setItem(TOKEN_STORAGE_KEY,String(token).trim())}\nfunction getActiveToken(){const fromUrl=getTokenFromUrl();if(fromUrl&&fromUrl.trim()){saveToken(fromUrl);return fromUrl.trim()}return getSavedToken()}\nfunction isDashboardUuid(value){const clean=String(value||"").trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(clean)}\nfunction getConfirmedDashboardToken(){const fromProfile=String(currentProfileData.dashboardToken||"").trim();if(isDashboardUuid(fromProfile))return fromProfile;const active=String(getActiveToken()||"").trim();if(isDashboardUuid(active))return active;return ""}'''
          new_token_block = '''function getTokenFromUrl(){return new URLSearchParams(location.search).get("token")}\nfunction getSavedToken(){return localStorage.getItem(TOKEN_STORAGE_KEY)}\nfunction getSavedDashboardToken(){return localStorage.getItem(DASHBOARD_TOKEN_STORAGE_KEY)}\nfunction saveToken(token){const clean=String(token||"").trim();if(clean&&!isDashboardUuid(clean))localStorage.setItem(TOKEN_STORAGE_KEY,clean)}\nfunction saveDashboardToken(token){const clean=String(token||"").trim();if(isDashboardUuid(clean))localStorage.setItem(DASHBOARD_TOKEN_STORAGE_KEY,clean)}\nfunction isDashboardUuid(value){const clean=String(value||"").trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(clean)}\nfunction getActiveToken(){const fromUrl=String(getTokenFromUrl()||"").trim();if(fromUrl){if(isDashboardUuid(fromUrl))saveDashboardToken(fromUrl);else saveToken(fromUrl);return fromUrl}return getSavedToken()||getSavedDashboardToken()}\nfunction getConfirmedDashboardToken(){const fromProfile=String(currentProfileData.dashboardToken||"").trim();if(isDashboardUuid(fromProfile)){saveDashboardToken(fromProfile);return fromProfile}const fromUrl=String(getTokenFromUrl()||"").trim();if(isDashboardUuid(fromUrl)){saveDashboardToken(fromUrl);return fromUrl}const saved=String(getSavedDashboardToken()||"").trim();if(isDashboardUuid(saved))return saved;return ""}'''
          assert old_token_block in html
          html = html.replace(old_token_block, new_token_block, 1)

          old_save = 'currentProfileData={email:data.email||"",units:total,referralAvailable,refCode:String(data.ref_code||"").trim(),dashboardToken:String(data.dashboard_token||"").trim(),refLink:String(data.ref_link||"").trim(),consumedUnits:consumed,unlockedTips:unlocked,membershipLevel,membership,premiumStart,premiumUntil,graceUntil,premiumStatus,autoRenew,tariffCode};saveToken(finalToken);showProfileBox();'
          new_save = 'currentProfileData={email:data.email||"",units:total,referralAvailable,refCode:String(data.ref_code||"").trim(),dashboardToken:String(data.dashboard_token||"").trim(),refLink:String(data.ref_link||"").trim(),consumedUnits:consumed,unlockedTips:unlocked,membershipLevel,membership,premiumStart,premiumUntil,graceUntil,premiumStatus,autoRenew,tariffCode};saveDashboardToken(currentProfileData.dashboardToken);if(isDashboardUuid(finalToken))saveDashboardToken(finalToken);else saveToken(finalToken);showProfileBox();'
          assert old_save in html
          html = html.replace(old_save, new_save, 1)

          old_open = 'function openReceivedProfileLink(){const token=extractTokenFromInput(document.getElementById("receivedProfileLink").value);if(!token){document.getElementById("receivedLinkMessage").innerText="Bitte Profil-Link oder Zugangscode eintragen.";return}saveToken(token);location.href="https://betinsightclub.github.io/profil/?token="+encodeURIComponent(token)+preserveSupportedHash()}'
          new_open = 'function openReceivedProfileLink(){const token=extractTokenFromInput(document.getElementById("receivedProfileLink").value);if(!token){document.getElementById("receivedLinkMessage").innerText="Bitte Profil-Link oder Zugangscode eintragen.";return}if(isDashboardUuid(token))saveDashboardToken(token);else saveToken(token);location.href="https://betinsightclub.github.io/profil/?token="+encodeURIComponent(token)+preserveSupportedHash()}'
          assert old_open in html
          html = html.replace(old_open, new_open, 1)

          old_forget = 'function forgetToken(){localStorage.removeItem(TOKEN_STORAGE_KEY);localStorage.removeItem("betinsight_email");'
          new_forget = 'function forgetToken(){localStorage.removeItem(TOKEN_STORAGE_KEY);localStorage.removeItem(DASHBOARD_TOKEN_STORAGE_KEY);localStorage.removeItem("betinsight_email");'
          assert old_forget in html
          html = html.replace(old_forget, new_forget, 1)

          assert 'Version: 2026.08.21-08' in html
          assert 'DASHBOARD_TOKEN_STORAGE_KEY="betinsight_dashboard_token"' in html
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit profile v08
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve support token alongside dashboard UUID"
          git push origin main

name: Install Querformat motif1 translations

on:
  push:
    branches:
      - querformat-sprachen-20260917
    paths:
      - .github/workflows/install-querformat-motif1.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: querformat-sprachen-20260917
      - name: Install motif 1 translations
        shell: bash
        run: |
          set -euo pipefail
          ZIP="marketing-center/downloads/bilder/.incoming/motif1_11jahre.zip"
          DEST="marketing-center/downloads/bilder"
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d "$DEST"
          for lang in en es fr it pt; do
            test -f "$DEST/betinsight-11-jahre-analyse-vorteil-${lang}-querformat.webp"
          done
          rm -f "$ZIP"
          rm -f ".github/workflows/install-querformat-motif1.yml"
      - name: Commit installed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing-center/downloads/bilder .github/workflows/install-querformat-motif1.yml
          git commit -m 'Install latest Querformat motif1 translations'
          git push origin HEAD:querformat-sprachen-20260917

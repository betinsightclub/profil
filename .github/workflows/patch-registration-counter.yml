name: Add registration counter

on:
  push:
    paths:
      - '.github/workflows/patch-registration-counter.yml'
      - '.github/scripts/patch_registration_counter.py'

permissions:
  contents: write

jobs:
  patch-backoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Backoffice registration counter
        run: python3 .github/scripts/patch_registration_counter.py
      - name: Commit Backoffice update
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add admin registration counter"
          git push

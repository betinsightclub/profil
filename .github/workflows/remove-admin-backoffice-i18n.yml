name: BetInsight one-time remove Admin Backoffice i18n

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/remove-admin-backoffice-i18n.yml'

permissions:
  contents: write

jobs:
  remove-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Admin Backoffice i18n loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin/backoffice/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  <script src="../../assets/admin-backoffice-i18n.js"></script>\n', '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git rm .github/workflows/remove-admin-backoffice-i18n.yml
          git add admin/backoffice/index.html
          git commit -m "revert: keep Admin Backoffice German-only"
          git push

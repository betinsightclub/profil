name: Install all Quadrat translations

on:
  push:
    branches:
      - querformat-sprachen-20260917
    paths:
      - .github/workflows/install-all-quadrat.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: querformat-sprachen-20260917
      - name: Install and verify all translated Quadrat images
        shell: bash
        run: |
          set -euo pipefail
          ZIP="marketing-center/downloads/bilder/.incoming/quadrat_translations_webp_all.zip"
          DEST="marketing-center/downloads/bilder"
          unzip -t "$ZIP"
          unzip -o "$ZIP" -d "$DEST"
          for stem in             betinsight-ein-moment-ein-treffer-eine-entscheidung             betinsight-entschieden-wird-am-schlusspfiff             betinsight-nicht-jeder-tipp-ist-gleich             betinsight-praezision-schlaegt-zufall             betinsight-vorsprung-analyse             betinsight-wir-analysieren-du-entscheidest; do
            for lang in en es fr it pt; do
              test -f "$DEST/${stem}-${lang}-quadrat.webp"
            done
          done
          rm -f "$ZIP"
          rm -f ".github/workflows/install-all-quadrat.yml"
      - name: Commit installed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing-center/downloads/bilder .github/workflows/install-all-quadrat.yml
          git commit -m 'Install complete multilingual Quadrat set'
          git push origin HEAD:querformat-sprachen-20260917

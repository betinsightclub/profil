name: Fix provider JSON batches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate provider JSON
        run: |
          python - <<'PY'
          import json, pathlib
          files = [
              'assets/provider-whitelist.json',
              'assets/provider-whitelist-batches.json',
              'assets/provider-whitelist-web-batch.json',
              'assets/provider-whitelist-web-batch-2.json',
              'assets/provider-whitelist-web-batch-3.json',
          ]
          repaired=[]
          for f in files:
              p=pathlib.Path(f)
              text=p.read_text(encoding='utf-8')
              try:
                  data=json.loads(text)
                  print('VALID', f)
                  continue
              except json.JSONDecodeError as e:
                  print('INVALID', f, e)
              fixed=None
              for n in range(1,4):
                  candidate=text + ('}'*n)
                  try:
                      json.loads(candidate)
                      fixed=candidate
                      print('REPAIR', f, 'added_closing_braces=', n)
                      break
                  except json.JSONDecodeError:
                      pass
              if fixed is None:
                  raise RuntimeError(f'Could not safely repair {f} by restoring trailing braces')
              p.write_text(fixed, encoding='utf-8')
              repaired.append(f)
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  data=json.load(fh)
              print('FINAL_VALID', f, 'keys=', list(data)[:6])
          manifest=json.load(open('assets/provider-whitelist-batches.json', encoding='utf-8'))
          for f in manifest.get('files',[]):
              p=pathlib.Path('assets')/f
              assert p.exists(), f'Missing manifest batch: {f}'
          print('REPAIRED_FILES', repaired)
          print('ALL_PROVIDER_JSON_VALID')
          PY
      - name: Commit repairs and remove temporary workflow
        run: |
          git config user.name "betinsightclub"
          git config user.email "betinsight.club@gmail.com"
          rm -f .github/workflows/fix-provider-batch2-json.yml
          git add assets/provider-whitelist-web-batch-2.json assets/provider-whitelist-web-batch-3.json .github/workflows/fix-provider-batch2-json.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix provider whitelist JSON batches"
          git push origin HEAD:main

name: Fix provider batch 2 JSON
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and validate provider JSON
        run: |
          python - <<'PY'
          import json, pathlib
          target = pathlib.Path('assets/provider-whitelist-web-batch-2.json')
          text = target.read_text(encoding='utf-8')
          try:
              json.loads(text)
              print('Batch 2 already valid; no repair needed')
          except json.JSONDecodeError as e:
              print('Current Batch 2 JSON error:', e)
              candidate = text + '}'
              json.loads(candidate)
              target.write_text(candidate, encoding='utf-8')
              print('Batch 2 repaired by restoring missing final closing brace')
          files = [
              'assets/provider-whitelist.json',
              'assets/provider-whitelist-batches.json',
              'assets/provider-whitelist-web-batch.json',
              'assets/provider-whitelist-web-batch-2.json',
              'assets/provider-whitelist-web-batch-3.json',
          ]
          for f in files:
              with open(f, encoding='utf-8') as fh:
                  data = json.load(fh)
              print('VALID', f, 'keys=', list(data)[:6])
          manifest = json.load(open('assets/provider-whitelist-batches.json', encoding='utf-8'))
          for f in manifest.get('files', []):
              p = pathlib.Path('assets') / f
              assert p.exists(), f'Missing manifest batch: {f}'
          print('ALL_PROVIDER_JSON_VALID')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "betinsightclub"
          git config user.email "betinsight.club@gmail.com"
          rm -f .github/workflows/fix-provider-batch2-json.yml
          git add assets/provider-whitelist-web-batch-2.json .github/workflows/fix-provider-batch2-json.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix provider whitelist batch 2 JSON"
          git push origin HEAD:main

name: BetInsight one-time move member language switch

on:
  push:
    branches:
      - feature/i18n-multilang-safe-v3
    paths:
      - .github/workflows/move-member-language-switch.yml

permissions:
  contents: write

jobs:
  move-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feature/i18n-multilang-safe-v3

      - name: Put language switch directly below sidebar logo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('assets/app-navigation-v2.js')
          text = path.read_text(encoding='utf-8')

          old_footer = '''    const footer = document.createElement("div");
    footer.className = "bi-nav-footer";
    footer.appendChild(i18n().createSwitcher());'''
          new_footer = '''    const languageSwitcher = i18n().createSwitcher();

    const footer = document.createElement("div");
    footer.className = "bi-nav-footer";'''
          if old_footer not in text:
              raise SystemExit('Expected footer switch block not found.')
          text = text.replace(old_footer, new_footer, 1)

          old_append = '    sidebar.append(brand, list, footer);'
          new_append = '    sidebar.append(brand, languageSwitcher, list, footer);'
          if old_append not in text:
              raise SystemExit('Expected sidebar append block not found.')
          text = text.replace(old_append, new_append, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git rm .github/workflows/move-member-language-switch.yml
          git add assets/app-navigation-v2.js
          git commit -m "ui: place member language switch below sidebar logo"
          git push origin HEAD:feature/i18n-multilang-safe-v3

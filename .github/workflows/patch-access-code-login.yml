name: BetInsight one-time access code login patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-access-code-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login copy, clean token entry, and i18n
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ('📩 Profil-Link anfordern', '📩 Zugangscode anfordern'),
            ('Fordere deinen Profil-Link per E-Mail an oder trage einen bereits erhaltenen Link direkt ein.', 'Fordere deinen persönlichen Zugangscode per E-Mail an oder gib ihn hier ein.'),
            ('Profil-Link anfordern', 'Zugangscode anfordern'),
            ('Profil-Link eintragen', 'Zugangscode eingeben'),
            ('Link oder Zugangscode aus deiner E-Mail verwenden.', 'Füge den persönlichen Zugangscode aus deiner BetInsight E-Mail ein.'),
            ('placeholder="Profil-Link oder Zugangscode"', 'placeholder="Persönlichen Zugangscode eingeben"'),
            ('🔓 Persönliches Profil öffnen', '🔓 Mit Zugangscode anmelden'),
            ('Profil-Link wird angefordert...', 'Zugangscode wird angefordert...'),
            ('✅ Wenn diese E-Mail bei BetInsight registriert ist, wurde der Profil-Link versendet. Bitte prüfe dein E-Mail-Postfach.', '✅ Wenn diese E-Mail bei BetInsight registriert ist, wurde der persönliche Zugangscode versendet. Bitte prüfe dein E-Mail-Postfach.'),
            ('Der Profil-Link konnte nicht gesendet werden. Prüfe die E-Mail-Adresse oder versuche es später erneut.', 'Der Zugangscode konnte nicht gesendet werden. Prüfe die E-Mail-Adresse oder versuche es später erneut.'),
            ('Bitte Profil-Link oder Zugangscode eintragen.', 'Bitte deinen persönlichen Zugangscode eintragen.')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)

          old_fn = 'function openReceivedProfileLink(){const token=extractTokenFromInput(document.getElementById("receivedProfileLink").value);if(!token){document.getElementById("receivedLinkMessage").innerText="Bitte deinen persönlichen Zugangscode eintragen.";return}if(isDashboardUuid(token))saveDashboardToken(token);else saveToken(token);location.href="https://betinsightclub.github.io/profil/?token="+encodeURIComponent(token)+preserveSupportedHash()}'
          new_fn = 'function openReceivedProfileLink(){const input=document.getElementById("receivedProfileLink"),msg=document.getElementById("receivedLinkMessage"),token=extractTokenFromInput(input?.value);if(!token){if(msg)msg.innerText="Bitte deinen persönlichen Zugangscode eintragen.";return}if(isDashboardUuid(token))saveDashboardToken(token);else saveToken(token);if(input)input.value="";if(msg)msg.innerText="✅ Zugangscode gespeichert. Profil wird geladen...";if(window.history&&window.history.replaceState)history.replaceState(null,"",location.pathname+location.hash);loadUnits()}'
          if old_fn not in s:
              raise SystemExit('Expected openReceivedProfileLink function not found')
          s = s.replace(old_fn, new_fn)
          p.write_text(s, encoding='utf-8')

          changes = {
            'de': {
              'resend':'📩 Zugangscode erneut per E-Mail senden',
              'openProfileCopy':'Fordere deinen persönlichen Zugangscode per E-Mail an oder gib ihn hier ein.',
              'requestLink':'Zugangscode anfordern',
              'requestButton':'📩 Zugangscode anfordern',
              'enterLink':'Zugangscode eingeben',
              'enterLinkCopy':'Füge den persönlichen Zugangscode aus deiner BetInsight E-Mail ein.',
              'linkPlaceholder':'Persönlichen Zugangscode eingeben',
              'openPersonal':'🔓 Mit Zugangscode anmelden'
            },
            'en': {
              'resend':'📩 Send Access Code Again by Email',
              'openProfileCopy':'Request your personal access code by email or enter it here.',
              'requestLink':'Request Access Code',
              'requestButton':'📩 Request Access Code',
              'enterLink':'Enter Access Code',
              'enterLinkCopy':'Paste the personal access code from your BetInsight email.',
              'linkPlaceholder':'Enter personal access code',
              'openPersonal':'🔓 Sign In with Access Code'
            }
          }
          for lang, vals in changes.items():
              fp = Path(f'assets/i18n/pages/dashboard/{lang}.json')
              data = json.loads(fp.read_text(encoding='utf-8'))
              data['dashboardPage'].update(vals)
              fp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/patch-access-code-login.yml
          git config user.name 'BetInsight Automation'
          git config user.email 'betinsight.club@gmail.com'
          git add index.html assets/i18n/pages/dashboard/de.json assets/i18n/pages/dashboard/en.json .github/workflows/patch-access-code-login.yml
          git commit -m 'security: switch member login to access-code entry'
          git push

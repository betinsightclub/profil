name: Stadionwelt JavaScript safety checks
on:
  push:
    paths:
      - 'stadionwelt/**'
      - '.github/workflows/stadionwelt-js-check.yml'
  pull_request:
    paths:
      - 'stadionwelt/**'
      - '.github/workflows/stadionwelt-js-check.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone WebGL-independent map fallback
        run: node --check stadionwelt/fallback-2d.js
      - name: Check standalone journey and cinematic flight scripts
        run: |
          node --check stadionwelt/passport-journey.js
          node --check stadionwelt/globe-flight.js
          node --check stadionwelt/visit-types.js
      - name: Check all inline Stadionwelt scripts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('stadionwelt/index.html','utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No scripts found in Stadionwelt');
          scripts.forEach((script, index) =>
            new vm.Script(script[1], {filename: 'stadionwelt/index.html#script-' + index}));
          const checks = [
            'function fallbackTo2D(', 'function showLeaf2D(', 'function showMap(',
            'function showGlobe(', 'function renderStreetDots(', 'BetInsightLeaflet2D'
          ];
          for(const item of checks)if(!html.includes(item))throw new Error('Missing ' + item);
          console.log('Syntax OK (' + scripts.length + ' scripts); fallback connected.');
          NODE
      - name: Regression - pinned Globe 2.45 constructor receives DOM element
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('stadionwelt/index.html','utf8');
          const match = html.match(/globe=(new Globe\([^;]+\));globeInitStage="configure-layers"/);
          assert(match, 'Expected documented new Globe(DOM, config) constructor');
          const context = {
            holder: { nodeType: 1 },
            globe: null,
            Globe: class {
              constructor(element, options) {
                assert.equal(element.nodeType, 1, 'DOM element must be passed first');
                assert.equal(options.animateIn, false);
                assert.equal(options.waitForGlobeReady, false);
                this.element = element;
                this.options = options;
              }
            }
          };
          vm.runInNewContext('globe=' + match[1] + ';',context);
          assert.equal(context.globe.element,context.holder);
          console.log('Pinned globe.gl v2.45 constructor contract passed');
          NODE
      - name: Regression - automatic 3D travel stays bundled and keeps zoom phases
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('stadionwelt/index.html','utf8');
          const canonical = fs.readFileSync('stadionwelt/globe-flight.js','utf8').trimEnd();
          const embedded = html.match(/<script data-stadium-globe-flight="inline">\n([\s\S]*?)\n<\/script>/);
          assert(embedded, '3D camera flight must be embedded before the page logic');
          assert.equal(embedded[1],canonical,'Embedded flight must stay in sync with standalone source');
          assert(html.indexOf(embedded[0]) < html.indexOf('function selectStadium('),'Flight must initialize before stadium selection');
          assert(!html.includes('globe.pointOfView(target,globeRotationDurationMs())'),'Do not silently regress to old eased camera motion');
          assert(html.includes('ROTATION_DEFAULT_SECONDS=4'),'Approved globe flight time is 4 seconds');
          assert(html.includes('duration:keepPassport?2800:850'),'Do not change satellite/2D selection timing');
          let t=0,frame=null,last={lat:21,lng:9,altitude:2.5};
          const calls=[];
          const scene={
            pointOfView(p,ms) {
              if(!p)return {...last};
              last={...p};calls.push({time:t,p:{...p},ms});
              return this;
            },
            controls(){return {autoRotate:false}}
          };
          const ctx={
            window:{},performance:{now:()=>0},
            requestAnimationFrame(fn){frame=fn;return 1},
            cancelAnimationFrame(){frame=null},
            console
          };
          vm.runInNewContext(canonical,ctx);
          assert(ctx.window.BetInsightStadiumFlight.flyTo(scene,{lat:45,lng:-75,altitude:1.15},4000));
          for(t=0;t<=4000;t+=20){const callback=frame;frame=null;if(callback)callback(t)}
          const sample=time=>calls.find(x=>x.time===time);
          assert(sample(480).p.altitude>=3.09,'Zoom-out must be visible even from overview');
          assert(sample(2000).p.altitude>=3.09,'Rotate at overview altitude');
          assert(sample(3900).p.altitude<3.1,'Quick zoom-in must begin before arrival');
          assert.equal(sample(4000).p.altitude,1.15,'Finish close to selected stadium');
          assert(Math.abs(sample(4000).p.lng+75)<1e-6,'Finish at selected stadium');
          assert(calls.every(x=>x.ms===0),'3D tween easing must remain disabled');
          console.log('Automatic globe flight: four-second zoom-out/travel/zoom-in sequence OK');
          NODE
      - name: Regression - attempt real globe before fallback
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('stadionwelt/index.html','utf8');
          const excerpt = (from,to) => {
            const start = html.indexOf(from);
            const end = html.indexOf(to,start);
            assert(start !== -1 && end > start, 'Missing source boundary: '+from);
            return html.slice(start,end);
          };
          const init = excerpt('function initGlobeWhenReady(){','window.addEventListener("stadium-globe-ready"');
          const context = {
            ready:true, globe:null, globeUnavailable:false, globeLibraryFailed:false,
            Globe:()=>{}, $:()=>({classList:{contains:()=>true,add:()=>{}},style:{}}),
            initGlobe(){this.globe={};},
            renderDots(){this.drawn=true;},
            fallbackTo2D(){this.fellBack=true;}
          };
          context.initGlobe = ()=>{context.globe={}};
          context.renderDots = ()=>{context.drawn=true};
          context.fallbackTo2D = ()=>{context.fellBack=true};
          vm.runInNewContext(init+';initGlobeWhenReady();',context);
          assert(context.globe && context.drawn, 'Globe should be attempted without a preliminary GPU rejection');
          assert(!context.fellBack,'3D should not be prematurely rejected');
          context.globe=null;context.drawn=false;context.globeLibraryFailed=true;context.Globe=undefined;
          vm.runInNewContext(init+';initGlobeWhenReady();',context);
          assert(context.fellBack,'3D script errors must still trigger 2D fallback');
          const select = excerpt('function showGlobe(){','window.addEventListener("maplibre-ready"');
          const button = {globeUnavailable:true,again:0,retryGlobe(){this.again++}};
          button.retryGlobe=()=>{button.again++};
          vm.runInNewContext(select+';showGlobe();',button);
          assert.equal(button.again,1,'3D tab must permit another attempt after fallback');
          const gpu = excerpt('function hasWebGL(kind){','function leaf2DConfig(');
          assert(!gpu.includes('loseContext()'),'GPU probes must not forcibly discard WebGL contexts');
          console.log('3D-first startup and manual retry regression checks passed.');
          NODE

name: Patch profile support UUID counter

on:
  push:
    paths:
      - '.github/workflows/patch-profile-support-uuid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profil/index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old_version = 'Version: 2026.08.21-08'
          new_version = 'Version: 2026.08.23-01'
          if new_version in html:
              print('Profile already patched.')
              raise SystemExit(0)
          if old_version not in html:
              raise SystemExit('Unexpected profile version; refusing automatic patch.')
          html = html.replace(old_version, new_version, 1)

          old_header = '''Änderungen:\n- SUPPORT-TOKEN-ERHALT 2026.08.21-08:'''
          new_header = '''Änderungen:\n- SUPPORT-UUID-ZAEHLER 2026.08.23-01:\n  - Der rote Support-Zähler im Profil verwendet jetzt dieselbe isolierte Support User API UUID v2 wie die Supportseite.\n  - Die Authentifizierung erfolgt ausschließlich über den bestätigten dashboard_token / UUID.\n  - Ungelesene Support-Antworten werden aus offenen und geschlossenen Tickets zusammengezählt.\n  - Der Support-Button übergibt die bestätigte UUID an die Supportseite; dort wird sie unmittelbar aus der sichtbaren URL entfernt.\n  - Alte normale Profil-/Support-Tokens werden für Support und Support-Zähler nicht mehr benötigt.\n  - Wechselstube, Netzwerk, Wallet, Tipps, Premium, Referral, Marketing-Center, Kauf und übrige Profilfunktionen bleiben unverändert.\n- SUPPORT-TOKEN-ERHALT 2026.08.21-08:'''
          if old_header not in html:
              raise SystemExit('Changelog anchor missing; refusing patch.')
          html = html.replace(old_header, new_header, 1)

          old_api = 'const SUPPORT_READER_URL="https://script.google.com/macros/s/AKfycbwgL2fh-4oBoaWBbtkSXaaKaEhcSIxtjPCENRObyfkMS0luNunCnjqSVt0PFTnGhZ9P/exec";'
          new_api = 'const SUPPORT_READER_URL="https://script.google.com/macros/s/AKfycbxI8UhsLynNM5dtjRXJNxnA5Fex6yamwt-X-Z4ca9UyOM8B3AacEOBldvpUO59LmWcs/exec";'
          if old_api not in html:
              raise SystemExit('Old support API constant missing; refusing patch.')
          html = html.replace(old_api, new_api, 1)

          pattern = re.compile(
              r'function isAcceptedSupportToken\(value\)\{.*?\}\n'
              r'function canonicalSupportReaderToken\(value\)\{.*?\}\n'
              r'function renderSupportUnread\(count\)\{.*?\}\n'
              r'async function refreshSupportUnread\(tokenOverride=""\)\{.*?\}\n'
              r'function buildTokenVariants',
              re.S
          )
          replacement = '''function renderSupportUnread(count){const badge=document.getElementById("supportUnreadBadge"),button=document.getElementById("supportButton");if(!badge||!button)return;const unread=Math.max(0,Math.floor(Number(count)||0));if(unread>0){badge.hidden=false;badge.textContent=unread>99?"99+":String(unread);badge.setAttribute("aria-label",unread+" ungelesene Support-Antworten");button.title=unread===1?"1 neue Support-Antwort":unread+" neue Support-Antworten"}else{badge.hidden=true;badge.textContent="0";badge.setAttribute("aria-label","0 ungelesene Support-Antworten");button.title="Support & Tickets öffnen"}}\nasync function refreshSupportUnread(tokenOverride=""){if(supportUnreadRequestInFlight)return;const override=String(tokenOverride||"").trim(),candidate=isDashboardUuid(override)?override:getConfirmedDashboardToken();if(!isDashboardUuid(candidate)){renderSupportUnread(0);return}supportUnreadRequestInFlight=true;try{const response=await fetch(SUPPORT_READER_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({action:"list",token:candidate}),cache:"no-store",redirect:"follow",credentials:"omit"});const raw=String(await response.text()||"").replace(/^\\uFEFF/,"").trim();if(!raw)throw new Error("Leere Support-Antwort");const data=JSON.parse(raw);if(data?.success!==true)throw new Error(data?.message||"Support-Zähler nicht verfügbar");const tickets=[...(Array.isArray(data.tickets)?data.tickets:[]),...(Array.isArray(data.closed_tickets)?data.closed_tickets:[])],unread=tickets.reduce((sum,ticket)=>sum+Math.max(0,Math.floor(Number(ticket?.user_ungelesen)||0)),0);renderSupportUnread(unread)}catch(error){console.warn("Support-Zähler konnte nicht geladen werden:",error);renderSupportUnread(0)}finally{supportUnreadRequestInFlight=false}}\nfunction buildTokenVariants'''
          html, count = pattern.subn(replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Support counter block replacement count={count}; refusing patch.')

          if 'refreshSupportUnread(finalToken);' not in html:
              raise SystemExit('Profile-load support counter call missing; refusing patch.')
          html = html.replace('refreshSupportUnread(finalToken);', 'refreshSupportUnread();', 1)

          old_go = 'function goSupport(){location.href="https://betinsightclub.github.io/profil/support/"}'
          new_go = 'function goSupport(){const dashboardToken=getConfirmedDashboardToken();if(dashboardToken){location.href="https://betinsightclub.github.io/profil/support/?token="+encodeURIComponent(dashboardToken);return}const msg=document.getElementById("message");if(msg)msg.innerText="Der Support konnte noch nicht geöffnet werden, weil der persönliche Dashboard-Zugang fehlt."}'
          if old_go not in html:
              raise SystemExit('goSupport anchor missing; refusing patch.')
          html = html.replace(old_go, new_go, 1)

          checks = [
              new_version,
              'AKfycbxI8UhsLynNM5dtjRXJNxnA5Fex6yamwt-X-Z4ca9UyOM8B3AacEOBldvpUO59LmWcs',
              'candidate=isDashboardUuid(override)?override:getConfirmedDashboardToken()',
              'data.closed_tickets',
              'function goSupport(){const dashboardToken=getConfirmedDashboardToken();'
          ]
          missing = [c for c in checks if c not in html]
          if missing:
              raise SystemExit('Sanity checks failed: ' + repr(missing))
          if 'isAcceptedSupportToken' in html or 'canonicalSupportReaderToken' in html:
              raise SystemExit('Legacy support-token helpers still present.')

          p.write_text(html, encoding='utf-8')
          print('Profile support UUID patch written successfully.')

      - name: Commit patched profile
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No profile changes to commit."
            exit 0
          fi
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "fix: move profile support counter to UUID API"
          git push

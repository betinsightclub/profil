name: BetInsight one-time Backoffice User-Zugang Button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-user-zugang-button.yml

permissions:
  contents: write

jobs:
  patch-backoffice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add User-Zugang button to Masterbereich
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("admin/backoffice/index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'id="masterUserAccessCard"'
          if marker in text:
              print("User-Zugang button already present. Nothing to do.")
              raise SystemExit(0)
          anchor = '      </article>\n      <article class="content-card full" id="model4060Card">'
          insert = '      </article>\n\n      <article class="content-card full" id="masterUserAccessCard" style="margin-bottom:16px">\n        <div class="panel-heading">\n          <div>\n            <h3>🔐 User-Profilzugang</h3>\n            <p class="muted">Wenn ein Profillink versehentlich geteilt oder öffentlich sichtbar wurde, kannst du hier für den betroffenen User einen neuen sicheren Profilzugang erzeugen.</p>\n          </div>\n          <a class="button button-primary" href="../user-zugang/">User-Zugang verwalten</a>\n        </div>\n        <div class="info-box">Nur für den Master-Admin. Beim Erneuern wird der bisherige Profillink ungültig; User-ID, Referral-Code, Units und Netzwerk bleiben unverändert.</div>\n      </article>\n\n      <article class="content-card full" id="model4060Card">'
          if anchor not in text:
              raise SystemExit("Expected Backoffice anchor not found; file left unchanged.")
          path.write_text(text.replace(anchor, insert, 1), encoding="utf-8")
          print("Backoffice User-Zugang button inserted.")
          PY

      - name: Commit Backoffice change
        shell: bash
        run: |
          if git diff --quiet -- admin/backoffice/index.html; then
            echo "No Backoffice change to commit."
            exit 0
          fi
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git add admin/backoffice/index.html
          git commit -m "feat: add User-Profilzugang button to master backoffice"
          git push

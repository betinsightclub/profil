name: BetInsight one-time member session navigation fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-member-session-navigation.yml'

permissions:
  contents: write

jobs:
  patch-session:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prefer confirmed dashboard session when re-opening dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'function loadUnits(){const token=getActiveToken();if(!token){showRequestBox();return}showProfileBox();document.getElementById("message").innerText="Kontostand wird geladen...";document.getElementById("units").innerText="0,00";renderHeaderReferralAvailable(0);document.getElementById("accountUnits").innerText="0";document.getElementById("unlockedTips").innerText="0";document.getElementById("consumedUnits").innerText="–";document.getElementById("email").innerText="Lade...";renderMembership(0,"Basis");fetchProfileByToken(buildTokenVariants(token),0)}'
          new = 'function loadUnits(){const fromUrl=String(getTokenFromUrl()||"").trim(),dashboard=String(getSavedDashboardToken()||"").trim(),profile=String(getSavedToken()||"").trim(),candidates=[];for(const value of [fromUrl,dashboard,profile]){if(!value)continue;for(const variant of buildTokenVariants(value)){if(variant&&!candidates.includes(variant))candidates.push(variant)}}if(!candidates.length){showRequestBox();return}showProfileBox();document.getElementById("message").innerText="Kontostand wird geladen...";document.getElementById("units").innerText="0,00";renderHeaderReferralAvailable(0);document.getElementById("accountUnits").innerText="0";document.getElementById("unlockedTips").innerText="0";document.getElementById("consumedUnits").innerText="–";document.getElementById("email").innerText="Lade...";renderMembership(0,"Basis");fetchProfileByToken(candidates,0)}'

          if new in text:
              print('Session fallback already installed.')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Session fallback installed.')
          else:
              raise SystemExit('Expected dashboard loadUnits block not found; no file changed.')

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git rm .github/workflows/fix-member-session-navigation.yml
          git add index.html
          git commit -m "fix: keep member session when using token-free menu navigation"
          git push

name: BetInsight one-time Admin Backoffice i18n install

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/install-admin-backoffice-i18n.yml'

permissions:
  contents: write

jobs:
  install-i18n:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject presentation-only i18n loader
        shell: python
        run: |
          from pathlib import Path

          path = Path('admin/backoffice/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '../../assets/admin-backoffice-i18n.js'

          if marker not in text:
              anchor = '</body>'
              if anchor not in text:
                  raise SystemExit('Backoffice closing body tag not found; file left unchanged.')
              insert = '  <script src="../../assets/admin-backoffice-i18n.js"></script>\n</body>'
              text = text.replace(anchor, insert, 1)
              path.write_text(text, encoding='utf-8')
              print('Admin Backoffice i18n loader inserted.')
          else:
              print('Admin Backoffice i18n loader already present.')

      - name: Commit installation and remove one-time workflow
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git rm .github/workflows/install-admin-backoffice-i18n.yml
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat: enable scalable DE EN switch in admin backoffice"
          git push

name: Add Telegram social link

on:
  push:
    paths:
      - '.github/workflows/add-telegram-social.yml'
      - '.github/scripts/add_telegram_social.py'

permissions:
  contents: write

jobs:
  patch-social-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared app footer
        run: python3 .github/scripts/add_telegram_social.py
      - name: Commit shared footer update
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/app-navigation.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add Telegram beside YouTube in app footer"
          git push

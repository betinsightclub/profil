name: Patch payout status UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Backoffice payout status labels
        run: python .github/scripts/patch_payout_status_ui.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/backoffice/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show concrete payout status reasons in admin backoffice"
            git push
          fi

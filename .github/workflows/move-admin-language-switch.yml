name: BetInsight one-time move Admin language switch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/move-admin-language-switch.yml

permissions:
  contents: write

jobs:
  move-switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move language switch below Backoffice logo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('assets/admin-backoffice-i18n.js')
          text = path.read_text(encoding='utf-8')

          old_style = '      .bi-admin-language-switcher{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 9px;border:1px solid rgba(0,218,255,.28);border-radius:11px;background:rgba(0,218,255,.07);color:#d8f5ff;font-weight:800}\n'
          new_style = '      .bi-admin-logo-stack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:0 0 auto}\n      .bi-admin-logo-stack .topbar-logo{max-width:118px}\n      .bi-admin-language-switcher{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 7px;border:1px solid rgba(0,218,255,.28);border-radius:10px;background:rgba(0,218,255,.07);color:#d8f5ff;font-weight:800}\n'
          if old_style in text:
              text = text.replace(old_style, new_style, 1)

          old_target = '    const target = document.querySelector(".top-actions") || document.querySelector(".topbar");\n    if (!target) return;'
          new_target = '    const logo = document.querySelector(".topbar-logo");\n    const brandGroup = document.querySelector(".brand-group");\n    if (!logo || !brandGroup) return;'
          if old_target not in text:
              raise SystemExit('Expected switch target block not found; no change made.')
          text = text.replace(old_target, new_target, 1)

          old_insert = '    switcher.append(icon, select);\n    target.prepend(switcher);'
          new_insert = '''    switcher.append(icon, select);

    let logoStack = brandGroup.querySelector(".bi-admin-logo-stack");
    if (!logoStack) {
      logoStack = document.createElement("div");
      logoStack.className = "bi-admin-logo-stack";
      brandGroup.insertBefore(logoStack, logo);
      logoStack.appendChild(logo);
    }
    logoStack.appendChild(switcher);'''
          if old_insert not in text:
              raise SystemExit('Expected switch insert block not found; no change made.')
          text = text.replace(old_insert, new_insert, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "BetInsight Automation"
          git config user.email "betinsight.club@gmail.com"
          git rm .github/workflows/move-admin-language-switch.yml
          git add assets/admin-backoffice-i18n.js
          git commit -m "ui: place Backoffice language switch below logo"
          git push

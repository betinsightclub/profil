name: Install Querformat translations

on:
  push:
    branches: [main]
    paths:
      - 'marketing-center/downloads/bilder/.incoming/querformat_translations_webp.zip'
      - '.github/workflows/install-querformat-translations.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract translated landscape images
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='marketing-center/downloads/bilder/.incoming/querformat_translations_webp.zip'
          if [ ! -f "$SOURCE" ]; then
            echo 'Incoming archive already removed; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import base64, io, re, zipfile

          source = Path('marketing-center/downloads/bilder/.incoming/querformat_translations_webp.zip')
          dest = Path('marketing-center/downloads/bilder')
          raw = source.read_bytes()

          def as_zip(data):
              bio = io.BytesIO(data)
              return data if zipfile.is_zipfile(bio) else None

          candidate = as_zip(raw)

          # Sometimes a binary upload can gain leading bytes. Recover from the first ZIP header.
          if candidate is None:
              pos = raw.find(b'PK\x03\x04')
              if pos >= 0:
                  candidate = as_zip(raw[pos:])

          # Or the staged object may contain base64 text, potentially wrapped across lines.
          if candidate is None:
              try:
                  cleaned = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
                  decoded = base64.b64decode(cleaned, validate=False)
                  candidate = as_zip(decoded)
              except Exception:
                  candidate = None

          if candidate is None:
              print('staged size:', len(raw))
              print('first 64 bytes:', raw[:64].hex())
              raise SystemExit('Could not recover a valid ZIP from staged package')

          allowed = {'.webp'}
          installed = 0
          with zipfile.ZipFile(io.BytesIO(candidate)) as z:
              for info in z.infolist():
                  name = Path(info.filename).name
                  if not name or Path(name).suffix.lower() not in allowed:
                      continue
                  if '/' in info.filename.strip('/') or '\\' in info.filename:
                      raise SystemExit(f'Unsafe archive entry: {info.filename}')
                  (dest / name).write_bytes(z.read(info))
                  installed += 1
                  print('installed', name)

          if installed != 20:
              raise SystemExit(f'Expected 20 translated WebP files, installed {installed}')
          PY
          rm -f "$SOURCE"
          rmdir 'marketing-center/downloads/bilder/.incoming' 2>/dev/null || true

      - name: Commit installed images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A marketing-center/downloads/bilder
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add translated landscape marketing images'
          git push

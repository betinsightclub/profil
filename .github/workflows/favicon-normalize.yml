name: Normalize favicon references

on:
  push:
    branches:
      - favicon-normalize-actual-20260825
    paths:
      - '.github/workflows/favicon-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize favicon references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          favicon_tag = '<link rel="icon" type="image/x-icon" href="/favicon.ico">'
          icon_pattern = re.compile(
              r'(?im)^[ \t]*<link\b(?=[^>\n]*\brel\s*=\s*["\'](?:shortcut\s+)?icon["\'])[^>\n]*>\s*\n?'
          )
          head_pattern = re.compile(r'(?i)<head(?:\s[^>]*)?>')

          changed = []
          skipped = []
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = icon_pattern.sub('', text)
              head = head_pattern.search(updated)
              if not head:
                  skipped.append(str(path))
                  continue
              updated = updated[:head.end()] + '\n  ' + favicon_tag + updated[head.end():]
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed HTML files: {len(changed)}')
          for item in changed:
              print(' -', item)
          if skipped:
              print('Skipped files without <head>:')
              for item in skipped:
                  print(' -', item)
          PY

      - name: Commit normalized favicon references
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git config user.name "betinsightclub"
          git config user.email "betinsight.club@gmail.com"
          git add -A
          git commit -m "Normalize favicon across all HTML pages"
          git push

name: Member image scanner pilot
on:
  pull_request:
    paths:
      - 'security/member-image-scanner/**'
      - '.github/workflows/member-image-scanner-pilot.yml'
  push:
    paths:
      - 'security/member-image-scanner/**'
      - '.github/workflows/member-image-scanner-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
        working-directory: security/member-image-scanner
      - run: python -m unittest -v
        working-directory: security/member-image-scanner

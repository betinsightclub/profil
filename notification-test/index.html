<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>(1) BetInsight Profil & Empfehlungscenter</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03131d}
    #app{border:0;width:100%;height:100%;display:block}
    #hint{position:fixed;left:12px;bottom:12px;z-index:999999;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.68);color:#d7edf7;font:600 12px Arial,sans-serif;pointer-events:none}
  </style>
</head>
<body>
  <iframe id="app" src="/"></iframe>
  <div id="hint">Nur Vorschau · keine Daten werden geändert</div>
  <script>
    (() => {
      const frame = document.getElementById('app');
      const normalTitle = 'BetInsight Profil & Empfehlungscenter';

      function inject() {
        let doc;
        try { doc = frame.contentDocument; } catch (_) { return; }
        if (!doc?.body) return;

        const menuButton = doc.querySelector('.bi-nav-group[data-bi-nav-group="tips-group"] > .bi-nav-group-button');
        if (!menuButton) { setTimeout(inject, 250); return; }
        if (doc.getElementById('biNotificationPreviewInjected')) return;

        const marker = doc.createElement('div');
        marker.id = 'biNotificationPreviewInjected';
        marker.hidden = true;
        doc.body.appendChild(marker);

        const style = doc.createElement('style');
        style.textContent = `
          .bi-preview-tip-target{position:relative!important}
          .bi-preview-tip-badge{position:absolute;right:34px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.92);border-radius:999px;background:#ff394d;color:#fff;font-size:11px;font-weight:900;line-height:1;box-shadow:0 4px 14px rgba(255,57,77,.42);z-index:9;pointer-events:none}
          .bi-preview-overlay{position:fixed;inset:0;z-index:16500;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,10,16,.72);backdrop-filter:blur(5px)}
          .bi-preview-popup{width:min(470px,100%);padding:24px;border:1px solid rgba(46,199,255,.43);border-radius:21px;background:linear-gradient(145deg,#0b4057,#061e2b 72%);box-shadow:0 28px 80px rgba(0,0,0,.55);text-align:left;color:#fff;font-family:Inter,Arial,sans-serif}
          .bi-preview-popup h3{margin:0 0 9px;color:#fff;font-size:22px}
          .bi-preview-popup p{margin:0;color:#c5e3f0;line-height:1.55;font-size:14px}
          .bi-preview-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}
          .bi-preview-actions button{min-height:42px;padding:10px 15px;border-radius:11px;font-weight:900;cursor:pointer}
          .bi-preview-open{border:0;background:linear-gradient(90deg,#168dff,#08bdec);color:#fff}
          .bi-preview-later{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#d9eef7}
        `;
        doc.head.appendChild(style);

        menuButton.classList.add('bi-preview-tip-target');
        const badge = doc.createElement('span');
        badge.className = 'bi-preview-tip-badge';
        badge.textContent = '1';
        menuButton.appendChild(badge);

        const overlay = doc.createElement('div');
        overlay.className = 'bi-preview-overlay';
        overlay.innerHTML = `<div class="bi-preview-popup" role="dialog" aria-modal="true"><h3>🔥 Neuer BetInsight-Tipp verfügbar</h3><p>Seit deinem letzten Besuch ist ein aktuell verfügbarer Tipp neu.</p><div class="bi-preview-actions"><button class="bi-preview-open" type="button">Tipp ansehen</button><button class="bi-preview-later" type="button">Später</button></div></div>`;
        doc.body.appendChild(overlay);

        const clearPreview = () => {
          overlay.remove();
          badge.remove();
          document.title = normalTitle;
        };

        overlay.querySelector('.bi-preview-later')?.addEventListener('click', () => overlay.remove());
        overlay.querySelector('.bi-preview-open')?.addEventListener('click', () => {
          clearPreview();
          frame.contentWindow.location.assign('/tipps/');
        });
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      }

      frame.addEventListener('load', () => setTimeout(inject, 350));
    })();
  </script>
</body>
</html>
